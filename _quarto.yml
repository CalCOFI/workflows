project:
  output-dir: _output
# bibliography: msens.bib
date: now
date-format: iso
format:
  html:
    toc: true              # md to exclude: {.unnumbered .unlisted}
    toc-depth: 4
    toc-expand: 1
    # toc-location: left
    number-sections: true  # md to exclude: {.unnumbered}
    code-fold: true
    code-tools: true
    embed-resources: false
    # mermaid-format: png  # DISABLED — PNG made diagrams zoomable via lightbox,
    #   but it routes every {mermaid} block and cc_erd() through headless Chrome,
    #   which hangs intermittently and unpredictably. Observed: ingest_spatial
    #   wedged for 3h15m on ONE small (60 KB) diagram that had rendered in ~2 min
    #   on a previous run, ignored SIGTERM, and needed SIGKILL — taking down two
    #   pipeline runs before the cause was identified. Default (JS, client-side)
    #   mermaid needs no browser, so renders cannot hang this way. Diagrams lose
    #   the lightbox zoom; that is the trade.
    lightbox: true         # still applies to images/plots, just not mermaid
    # the calcofi.io brand contract (https://calcofi.io/brand/v2/): favicon,
    # ?theme= / cookie-driven dark|light via bootstrap's colour modes, and the
    # header with the logo linking to calcofi.io. Already-rendered notebooks get
    # the same two snippets from scripts/brand_inject_html.R at deploy time.
    include-in-header: libs/brand/quarto_head.html
    include-before-body: libs/brand/quarto_header.html
execute:
  echo: true
  warning: false
  message: true
editor:
  mode: source
  markdown:
    wrap: 72
  canonical: true
editor_options:
  chunk_output_type: console
search: false
