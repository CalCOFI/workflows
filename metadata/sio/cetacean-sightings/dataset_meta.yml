# descriptive metadata for sio_cetacean-sightings -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_sio_cetacean-sightings.qmd
# Was a holding (status: external, WS-R1 2026-09-05) until 2026-09-27, when
# ingest_sio_cetacean-sightings.qmd started staging it from the curated CSVs in
# CalCOFI/marmam-app. The holding-only keys (status, priority_caloos, module,
# next_step) and the structural keys (dataset_name, dataset_name_short,
# category) left this file then; the structural ones now live in the notebook.
#
# Released dataset since 2026-10-04 (Ben): the holding keys (status: external and
# the repeated structural keys) are gone, so the dataset_key is a released dataset
# and no longer a holding in metadata/holdings.csv. A dataset_key is a holding or
# a released dataset, never both. The licence (Q01) and citation (Q02) stay
# `proposed` questions: the dataset ships under the EDI knb-lter-cce.262.2 terms
# as recorded, and the lab is asked to confirm they cover 2004 and 2016-2022.
  visibility: public
  description: >
    Cetacean (whale, dolphin, porpoise) sightings and on-effort visual
    line-transect survey segments from quarterly CalCOFI cruises, 2004-2022
    (effort through 2021). Curated by the Scripps Whale Acoustics Lab
    (Hildebrand / Baumann-Pickering) and staged from the CalCOFI marine mammal
    Shiny app repository (CalCOFI/marmam-app). The same cruises also carry the
    Farallon Institute's seabird and marine mammal survey
    (farallon_bird-mammal), run by an independent observer team: both datasets
    are kept, so a cetacean group seen by both teams appears once in each, and
    summing the two counts the same animals twice. The behaviour codes
    (primary and other behaviour) are held back: they are bare numeric codes
    with no codebook yet (Q03), so no behaviour rows are published until the
    lab supplies one; they remain in the archived source.
  # source: caloos-sheet row 23, 2026-09-05; the span reads 2004 to 2022 here
  # (2026-10-04), the years the ingest publishes, where the sheet said 2004 to 2015
  abstract: >
    CalCOFI Underway Marine Mammal Sighting Surveys contains visual sighting
    records of cetaceans (whales and dolphins) collected during California
    Cooperative Oceanic Fisheries Investigations (CalCOFI) cruises, run by the
    Scripps Institution of Oceanography (SIO), to understand cetacean ecology
    and habitat use. The dataset covers the CalCOFI station grid off Southern
    and Central California, recorded while the ship transits between stations,
    and spans 2004 to 2022 (the EDI package it was first published as covers
    2005 to 2015), with cruises conducted quarterly. Trained observers
    watch for cetaceans during daylight hours using standard line-transect
    distance-sampling methods (Burnham et al. 1980; Buckland et al. 1993;
    Barlow 1995), recording each sighting's location and distance from the
    ship's track. Surveys are conducted during favorable weather, with calm
    seas (Beaufort state 5 or below) and visibility beyond 1 nautical mile.
    This dataset supports study of cetacean distribution and habitat use
    relative to oceanographic conditions, for researchers studying marine
    mammal ecology in the California Current.
