# descriptive metadata for sio_cetacean-sonobuoy -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_sio_cetacean-sonobuoy.qmd
# First staged 2026-09-27 from CalCOFI/marmam-app (data/acoustic_data/acoustic-raw.csv,
# the "Everything" sheet of "CalCOFI data all cruises, calculations.xlsx").
  visibility: public
  description: >
    Hourly presence of blue, fin and humpback whale calls in sonobuoy
    recordings from CalCOFI cruises, 2004-2012. Each record is one hour of a
    DIFAR or omnidirectional sonobuoy deployment near a CalCOFI station,
    scanned by an analyst as 60-second spectrogram windows, with the call types
    heard. Curated by the Scripps Whale Acoustics Lab (Baumann-Pickering) and
    staged from the CalCOFI marine mammal Shiny app repository
    (CalCOFI/marmam-app).
  # no formal citation stated in the source repository -- Q02
  citation_main: ""
