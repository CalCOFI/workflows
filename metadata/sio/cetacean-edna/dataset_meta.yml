# descriptive metadata for sio_cetacean-edna -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_sio_cetacean-edna.qmd
# First staged 2026-09-27 from CalCOFI/marmam-app (data/edna_data/edna.csv).
# Not the same dataset as calpoly_whale-edna (the Zenodo ASV tables and whale
# density model); this is the per-sample cetacean detection table.
  visibility: public
  description: >
    Cetacean species detections from environmental DNA (eDNA) in seawater
    samples collected by the NOAA CalCOFI Genomics Program (NCOG) at 10-40 m
    (a few deeper) on CalCOFI cruises, 2014-2016. Seven dolphin and whale
    species detected by metabarcoding: 1 = detected, 0 = not detected in a
    sequenced sample (a non-detection, not a confirmed absence). Samples that
    failed PCR are kept as samples with no result until the provider says what
    a PCR negative means. Each sample is timed by its CTD-rosette bottle cast.
    Staged from the CalCOFI marine mammal Shiny app repository
    (CalCOFI/marmam-app).
  # no formal citation stated in the source repository -- Q02
  citation_main: ""
