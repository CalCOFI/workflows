# descriptive metadata for sio_mesopelagic-fish -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_sio_mesopelagic-fish.qmd
  visibility: public
  description: >
    Species-resolved mesopelagic fish counts (90 named species + 1
    unidentified-fish catch-all) from MOHT (Matsuda-Oozeki-Hu Trawl)
    micronekton net tows, 7 CalCOFI cruises 2010-2012, all on RV New
    Horizon (NODC 32NM). Larval-fish counts in the same source file are a
    separate table, not included here.
  citation_main: >
    Koslow, J. Anthony (2016). CalCOFI Trawl Data. In California
    Cooperative Oceanic Fisheries Investigations (CalCOFI): Acoustic and
    Trawl Data. UC San Diego Library Digital Collections.
    https://doi.org/10.6075/J0BZ64DH
  link_calcofi_org: ""
  link_data_source: "https://library.ucsd.edu/dc/object/bb9217084g"
  link_others: ["https://doi.org/10.1016/j.pocean.2013.05.013"]
  # source: the DOI already embedded in citation_main above; confirmed
  # https://doi.org/10.6075/J0BZ64DH resolves (302 -> the Library object).
  # The Library object page itself (bb9217084g) is behind a Cloudflare/Anubis
  # bot check that blocks automated fetches, so no further metadata (e.g. a
  # second, object-level DOI) could be independently verified. checked 2026-09-03
  doi: 10.6075/J0BZ64DH
  # normalized to SPDX id (was "CC BY 4.0")
  license: CC-BY-4.0
  pi_names: J. Anthony Koslow
  # GCMD Science Keywords, proposed by WS-R1 from the category + measurement types;
  # source: https://gcmd.earthdata.nasa.gov/KeywordViewer/ (GCMD KMS export), checked 2026-09-05
  keywords_gcmd:
    - "EARTH SCIENCE > BIOLOGICAL CLASSIFICATION > ANIMALS/VERTEBRATES > FISH"
    - "EARTH SCIENCE > BIOLOGICAL CLASSIFICATION > ANIMALS/VERTEBRATES > FISH > RAY-FINNED FISHES"
