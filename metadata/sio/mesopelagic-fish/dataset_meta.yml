# descriptive metadata for sio_mesopelagic-fish -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_sio_mesopelagic-fish.qmd
  visibility: public
  description: >
    Species-resolved mesopelagic fish counts (90 named species + 1
    unidentified-fish catch-all) from MOHT (Matsuda-Oozeki-Hu Trawl)
    micronekton net tows, 7 CalCOFI cruises 2010-2012, all on RV New
    Horizon (NODC 32NM). Larval-fish counts in the same source file are a
    separate table, not included here.
  citation_main: >
    Koslow, J. Anthony (2016). CalCOFI Trawl Data. In California
    Cooperative Oceanic Fisheries Investigations (CalCOFI): Acoustic and
    Trawl Data. UC San Diego Library Digital Collections.
    https://doi.org/10.6075/J0BZ64DH
  link_calcofi_org: ""
  link_data_source: "https://library.ucsd.edu/dc/object/bb9217084g"
  link_others: ["https://doi.org/10.1016/j.pocean.2013.05.013"]
  # source: caloos-sheet row 36, 2026-09-05. Full EML abstract (description
  # above stays the short card-level summary).
  abstract: >
    CalCOFI Mesopelagic Fish Abundance via MOHT trawl contains trawl survey
    observations documenting the composition and abundance of mesopelagic
    fishes, krill, and other micronekton in the California Current,
    collected as part of the California Cooperative Oceanic Fisheries
    Investigations (CalCOFI) program. The dataset covers the California
    Current, sampled aboard the research vessel R/V New Horizon, and spans
    January 2010 through November 2012. Fishes and other micronektonic
    organisms were sampled using a Matsuda-Oozeki-Hu Trawl (MOHT), a type of
    midwater trawl net, with the volume of water filtered during each tow
    estimated from calibrated TSK flowmeter measurements. This dataset
    supports research on mesopelagic fish and micronekton community
    composition and abundance, and is intended for researchers studying
    deep-scattering-layer organisms and food web dynamics in the California
    Current.
