# source: caloos-sheet row 36, 2026-09-05
abstract: CalCOFI Mesopelagic Fish Abundance via MOHT trawl contains trawl survey
  observations documenting the composition and abundance of mesopelagic fishes, krill,
  and other micronekton in the California Current, collected as part of the California
  Cooperative Oceanic Fisheries Investigations (CalCOFI) program. The dataset covers
  the California Current, sampled aboard the research vessel R/V New Horizon, and
  spans January 2010 through November 2012. Fishes and other micronektonic organisms
  were sampled using a Matsuda-Oozeki-Hu Trawl (MOHT), a type of midwater trawl net,
  with the volume of water filtered during each tow estimated from calibrated TSK
  flowmeter measurements. This dataset supports research on mesopelagic fish and micronekton
  community composition and abundance, and is intended for researchers studying deep-scattering-layer
  organisms and food web dynamics in the California Current.
