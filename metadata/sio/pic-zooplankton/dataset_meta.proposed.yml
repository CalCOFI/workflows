# source: caloos-sheet row 9, 2026-09-05
abstract: CalCOFI Zooplankton Biovolumes contains standardized volume measurements
  of zooplankton collected as part of the California Cooperative Oceanic Fisheries
  Investigations (CalCOFI) program, a joint effort by NOAA's Southwest Fisheries Science
  Center, the Scripps Institution of Oceanography, and the California Department of
  Fish and Wildlife, to track zooplankton standing stock as an indicator of ocean
  productivity. The dataset covers primarily the CalCOFI station grid off Southern
  and Central California and spans 1951 to ongoing, with cruises currently conducted
  quarterly. Zooplankton are collected using oblique net tows, a 1-meter ring net
  used from 1951 into the late 1960s and the bongo net (two 0.71-meter nets) used
  since. Samples are measured for wet displacement volume, the space the preserved
  zooplankton takes up in a graduated container, following methods from Kramer et
  al. (1972) and Smith and Richardson (1977), and reported as ml/1,000 m^3 of water
  sampled. Small plankton is this volume after organisms over 5 ml are removed, while
  total plankton includes them. This dataset supports tracking of zooplankton abundance
  over time, for researchers studying prey availability for coastal pelagic species
  and fish larvae. It complements CalCOFI's zooplankton taxonomic (ZooDb) and imagery
  (ZooScan) datasets, which identify species composition rather than bulk volume.
