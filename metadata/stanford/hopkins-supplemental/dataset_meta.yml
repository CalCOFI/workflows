# source: caloos-sheet row 34, 2026-09-05
abstract: CalCOFI Supplemental Data from Monterey Bay contains additional hydrographic,
  meteorological, and biological observations collected by the Hopkins Marine Station
  of Stanford University as part of the California Cooperative Oceanic Fisheries Investigations
  (CalCOFI) program, including temperature, salinity, dissolved oxygen, phosphate,
  silicate, meteorological conditions, and fish and marine mammal counts. The dataset
  covers Monterey Bay, California, as part of Hopkins Marine Station's weekly CalCOFI
  sampling program that ran from March 1951 through June 1974. The underlying records
  exist primarily as digitized images and PDF scans of the original field notebooks
  and reports, housed in the Stanford Digital Repository, with extraction into a structured,
  actionable dataset still in progress as of the most recent public update. This dataset
  supports historical research on oceanographic and ecological conditions in Monterey
  Bay and is intended for researchers studying long-term environmental change in the
  California Current.

