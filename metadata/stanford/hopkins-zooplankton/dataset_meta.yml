# source: dataset README, "quality-assurance procedures", checked 2026-10-11
quality_control_md: >-
  Each log sheet was transcribed twice, independently. No edits were made to the
  transcriptions by library staff. This ingest keeps a value only where the two
  transcriptions agree or only one transcribed it (flagged
  `single_transcription`); cells where they disagree are withheld and listed for
  checking against the scans.

