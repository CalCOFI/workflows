# source: caloos-sheet row 35, 2026-09-05
abstract: Stanford Hopkins Marine Station CalCOFI Phytoplankton Data contains transcribed
  records of phytoplankton composition, collected by the Hopkins Marine Station of
  Stanford University as part of the California Cooperative Oceanic Fisheries Investigations
  (CalCOFI) program to help understand the environmental conditions surrounding the
  collapse of the California sardine fishery. The dataset covers Monterey Bay, California,
  and spans 1954 to 1968, a subset of Hopkins Marine Station's broader weekly CalCOFI
  sampling program that ran from March 1951 through June 1974. Data were collected
  through weekly field sampling and later transcribed from the original raw and aggregated
  records held at the Hopkins Marine Station library. This dataset supports historical
  research on phytoplankton community composition in Monterey Bay, extending oceanographic
  observations in the Northeast Pacific decades into the past, and is intended for
  researchers studying long-term or historical trends in phytoplankton populations
  and California Current oceanography. This dataset covers only a subset of the full
  1951 to 1974 Hopkins Marine Station sampling period; Moss Landing Marine Laboratories
  took over the Monterey Bay sampling program in July 1974, continuing similar sampling
  until it appears to have ended in 1979.

