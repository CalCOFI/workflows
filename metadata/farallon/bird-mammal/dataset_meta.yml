# descriptive metadata for farallon_bird-mammal -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_farallon_bird-mammal.qmd
  visibility: public
  description: >
    Bird and mammal observations along CalCOFI (and NMFS, CPR) cruise transects,
    1987-present. Transect effort, counts, and species live from NOAA ERDDAP
    (CAC_FI_SBAS_tr / CAC_FI_SBAS_obs / CAC_FI_SBAS_sp); behavior lookups
    curated via CCE-LTER DataZoo 255 (PI Bill Sydeman).
  # no formal author/year/title citation is stated on the ERDDAP dataset or the
  # DataZoo catalog page — left empty; see
  # metadata/farallon/bird-mammal/questions.csv Q09 (proposed to Sydeman/Thompson)
  citation_main: ""
  link_calcofi_org: ""
  # the PFEG ERDDAP tables, not the Datazoo catalog page (which still answers
  # 200 but is on its way out; it survives as prose in `description` above).
  # link_data_source is the observations table (CAC_FI_SBAS_obs); the transect
  # and species tables are cited in link_others below. Per Ben (2026-08-25):
  # ERDDAP is back online, so the ingest's Read Source Data step now pulls
  # transects + observations + species live from oceanview.pfeg.noaa.gov
  # instead of the local DataZoo 255 export -- coastwatch serves the same
  # datasets but was unreachable when last checked (2026-08-24), and oceanview
  # is the host the ichthyo tow links already use. Behavior lookup CONFIRMED
  # not on ERDDAP (CAC_FI_SBAS_beh checked directly on oceanview 2026-09-02 —
  # 404) and stays DataZoo/local-sourced — see Read Source Data below and Q10.
  # The ERDDAP tables are downloaded first (data/cache/, archived to GCS) so a
  # run reads bytes it can name; the species vocabulary is staged through
  # calcofi4db::append_dataset_taxon() with DataZoo's TSNs riding along as the
  # audit value (Q10); the observations table carries no 2021 rows (Q11).
  # Once a release carries this, delete the matching override arm in
  # db-viz-station scripts/build_datasets.sql.
  link_data_source: "https://oceanview.pfeg.noaa.gov/erddap/tabledap/CAC_FI_SBAS_obs.html"
  link_others:
    - https://oceanview.pfeg.noaa.gov/erddap/tabledap/CAC_FI_SBAS_tr.html
    - https://oceanview.pfeg.noaa.gov/erddap/tabledap/CAC_FI_SBAS_sp.html
    - http://dx.doi.org/10.6073/pasta/4ee1bd702acb11786277192a41626800
  # ERDDAP .das globals: creator_name "Sarah Ann Thompson", institution
  # "Farallon Institute, Scripps Institution of Oceanography"; `license`
  # points at a data-sharing-agreement PDF rather than stating terms inline.
  # source: https://oceanview.pfeg.noaa.gov/erddap/tabledap/CAC_FI_SBAS_obs.das, checked 2026-09-03
  license: custom
  license_url: https://oceanview.pfeg.noaa.gov/CalCOFI/app/resources/docs/Data_Sharing_Agreement_FarallonInstitute.pdf
  pi_names: Bill Sydeman
  # GCMD Science Keywords, proposed by WS-R1 from the category + measurement types;
  # source: https://gcmd.earthdata.nasa.gov/KeywordViewer/ (GCMD KMS export), checked 2026-09-05
  keywords_gcmd:
    - "EARTH SCIENCE > BIOLOGICAL CLASSIFICATION > ANIMALS/VERTEBRATES > BIRDS"
    - "EARTH SCIENCE > BIOLOGICAL CLASSIFICATION > ANIMALS/VERTEBRATES > MAMMALS"
