# source: caloos-sheet row 14, 2026-09-05
abstract: CalCOFI Seabird Visual Observations contains counts of seabirds and other
  marine animals recorded during at-sea surveys conducted by the Farallon Institute
  as part of the California Cooperative Oceanic Fisheries Investigations (CalCOFI),
  the California Current Ecosystem Long-Term Ecological Research (CCE-LTER) program,
  and the Southern California Coastal Ocean Observing System (SCCOOS), to monitor
  seabird distribution and abundance in the California Current. Surveys cover the
  Southern California Bight and the Central California Coast and have been conducted
  seasonally since 1987, with the Farallon Institute responsible for surveys since
  2008. On each cruise, an observer stationed on the ship's bridge records the species
  and number of animals sighted, while onboard software logs the ship's geographic
  position for each observation. This dataset supports monitoring of seabird distribution
  in relation to prey availability and ocean conditions, for researchers studying
  seabird-forage fish relationships in the California Current ecosystem. It complements
  the companion Seabird Transect Log dataset, which records survey effort and trackline
  data separately from these sighting records.
