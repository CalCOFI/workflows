# descriptive metadata for swfsc_ichthyo -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_swfsc_ichthyo.qmd
  visibility: public
  description: >
    Ichthyoplankton (fish eggs and larvae) collected by bongo and manta net
    tows on CalCOFI cruises, processed by SWFSC. Counts are per net, with
    SWFSC's own effort (volume filtered, standard haul factor, proportion
    sorted). A tow with no egg, larva or invertebrate record is a true zero:
    it stays as a sample with its effort, and abundance rows are positive only.
    Counts of species codes that share a WoRMS AphiaID are summed per net; each
    code keeps its own name. A tow's and net's maximum depth is SWFSC's
    NetDepth, the estimated depth of the net when all wire is out (roughly the
    tow's maximum depth, from wire out and wire angle), not a measured depth:
    over a shallower sea floor the net did not reach it. Egg stages 12-15 are
    removed at source. Fish larger than larval size (mostly juveniles), counted
    in addition to the larvae, are in their own table, fish. Each net's side of
    a bongo pair and its tow number are in ichthyo_net. MOCNESS tows are not in
    the source.
