# descriptive metadata for swfsc_cufes -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_swfsc_cufes.qmd
  visibility: public
  description: >
    Continuous Underway Fish Egg Sampler (CUFES) egg counts (sardine, anchovy,
    jack mackerel, hake, squid, other) and eggs per cubic metre pumped, from
    CalCOFI cruises (1996-2022). Source: SWFSC's CSV export of its CalCOFI
    database (Cufes.csv, linked to the cruise list by CruiseId); until release
    v2026.10.01 the same records were read from NOAA CoastWatch ERDDAP
    erdCalCOFIcufes.
  # no formal author/year/title citation is stated in the ERDDAP .das —
  # left empty; see metadata/swfsc/cufes/questions.csv Q06 (proposed to
  # NOAA SWFSC / Ed Weber / Noelle Bowlin)
  citation_main: ""
  # source: caloos-sheet row 2, 2026-09-05. Full EML abstract (description
  # above stays the short card-level summary).
  abstract: >
    CalCOFI Continuous Underway Fish-Egg Sampler Counts contains fish egg
    abundance data collected as part of the California Cooperative Oceanic
    Fisheries Investigations (CalCOFI) program, led by NOAA's Southwest
    Fisheries Science Center (SWFSC), to map the fine-scale spatial
    distribution of coastal pelagic fish spawning along the cruise track.
    The dataset covers CalCOFI cruise tracklines off Southern and Central
    California and starts March 1996 and is ongoing. The data includes
    counts of anchovy, sardine, jack mackerel, squid, hake, and unidentified
    fish eggs, along with associated environmental data. Eggs are collected
    using the Continuous Underway Fish-Egg Sampler (CUFES), which pumps
    near-surface water continuously while the ship is underway between
    CalCOFI stations. CUFES data are used to stratify the survey area into
    high- and low-egg-density regions, improving the precision of DEPM
    biomass estimates for sardine and anchovy. It complements the CalCOFI
    net-tow egg count dataset, which samples at discrete stations rather
    than continuously along the track.
