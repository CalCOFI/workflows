# source: caloos-sheet row 10, 2026-09-05
abstract: CalCOFI Additional CTD Hydrographic Cast Data contains temperature, salinity,
  and dissolved oxygen measurements from CTD (conductivity-temperature-depth) casts
  taken during California Cooperative Oceanic Fisheries Investigations (CalCOFI) cruises
  and related NOAA cruises. The dataset covers primarily the CalCOFI station grid
  off Southern and Central California, with related NOAA cruises extending north into
  the Pacific Northwest and offshore, and spans 2002 to 2014. A CTD instrument is
  lowered through the water column at each station, recording temperature, salinity,
  dissolved oxygen concentration and saturation, and depth to about 1,000 meters.
  Most oxygen and salinity values here have not been calibrated against water samples,
  so users needing calibrated hydrographic data should use the SIO CalCOFI CTD cast
  and bottle datasets instead, which are corrected using bottle sample comparisons.
  This dataset is best used as a supplementary record of additional NOAA CTD casts
  outside the primary SIO hydrographic time series.

