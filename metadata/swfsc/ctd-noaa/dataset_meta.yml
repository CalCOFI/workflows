quality_control_md: >-
  QC flags present: No. Salinity and oxygen are mostly uncalibrated (ERDDAP
  summary). Some values look like sensor artefacts (surface salinity of 22-24
  PSU offshore; oxygen of 12-13 ml/L at 6 degC on 2012-04) and are published
  pending the provider's answer (Q02).

