# source: caloos-sheet row 41, 2026-09-05
abstract: Baleen Whale Density Prediction from Environmental DNA (eDNA) contains processed
  amplicon sequence variant (ASV) abundance tables for three eDNA markers, 16S rRNA,
  18S rRNA V4, and 18S rRNA V9, developed by Erin Satterthwaite, Trevor Ruiz, Nastassia
  Patin, and colleagues to test whether microbial and small zooplankton communities
  can predict the density of baleen whales in the southern California Current Ecosystem.
  The dataset covers CalCOFI cruises in the southern California Current Ecosystem
  and spans 2014 to 2020, combining eDNA data from the NOAA CalCOFI Genomics Program
  (NCOG) with line-transect distance-sampling density estimates for blue, fin, and
  humpback whales derived from CalCOFI whale sighting surveys. The data are analyzed
  using stability selection adapted to sparse partial least squares (sPLS) regression,
  a statistical method for identifying reliable microbial and zooplankton predictors
  of whale density within large sequencing datasets. Processed data includes ASV tables
  with taxonomic annotations, sample metadata, density estimates, and cross-validation
  partitions. This dataset supports research on eDNA-based indicators of marine mammal
  distribution and is intended for researchers studying whale ecology and biomonitoring
  methods in the California Current.

