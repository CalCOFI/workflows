# descriptive metadata for cdfw_dungeness-crab -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_cdfw_dungeness-crab.qmd
  visibility: public
  description: >
    Dungeness crab (Metacarcinus magister) megalopae and larval decapods
    picked from archived CalCOFI oblique-tow plankton samples, examined for the
    California Department of Fish and Wildlife. Two efforts: a 2008-2014 time
    series of 310 sorted samples (A. Klemmedson, 2015) yielding 24 M. magister
    megalopae from 14 samples, and 216 archived samples from the 1949-2009
    sorting log that were examined and found free of M. magister (1984-2009,
    E. Jones, as of 2012-02-15). Only examined samples are published — the
    log's remaining unsorted rows are a fact of the archive's inventory, not a
    sample of this dataset. Spring cruises, CalBOBL oblique tows, lines < 80 /
    stations < 90. Counts are occurrence in the examined aliquot, not
    standardized density. Sorting was performed at the SIO Pelagic
    Invertebrate Collection, where the removed megalopae are archived in
    vials.
  # Per CDFW via E. Satterthwaite, 2026-08-13. Laura Rogers-Bennett is the
  # primary data provider; the sorters are credited because the examination
  # effort IS the dataset. CDFW is the current citable custodian even though
  # the work originated under CFG in 2012 — the agency was renamed, and the
  # current name is the one a reader can act on.
  citation_main: >
    Rogers-Bennett, L.; Jones, E.; Klemmedson, A. (2026). CDFW Dungeness Crab
    Megalopae from archived CalCOFI plankton samples (1949-2014). California
    Department of Fish and Wildlife, published through CalCOFI / Scripps
    Institution of Oceanography.
  link_calcofi_org: ""
  # placeholder until the UCSD Library RDC deposit (2026-08-27) is minted — see Q14
  link_data_source: "https://library.ucsd.edu/dc/search?q=CalCOFI+Dungeness+crab+megalopae"
  link_others: []
  # coverage_temporal / coverage_spatial deliberately absent: measured at
  # release time by calcofi4db::observed_coverage() now that this dataset
  # reaches the core. Do not re-assert them — see "Coverage is measured, never
  # asserted" in CLAUDE.md. Now that only the 216 EXAMINED sorting-log tows
  # publish, the measured extent is 132.25-120.675 W / 33.46-51.05 N — the
  # sorting log's most extreme west/north rows (to ~164 W) were unsorted and
  # are no longer part of this dataset. Still genuinely offshore/north of the
  # CalCOFI grid (see "Build Sorting Log"), not a defect.
  # normalized to SPDX id (was "CC BY 4.0"); source: CDFW via E. Satterthwaite,
