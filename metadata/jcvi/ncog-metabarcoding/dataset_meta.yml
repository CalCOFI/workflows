# source: caloos-sheet row 30, 2026-09-05
abstract: CalCOFI Microbial/Plankton Community Genomics (16S and 18S rDNA) contains
  ribosomal RNA (rRNA) gene metabarcoding sequence data, collected as part of the
  NOAA CalCOFI Genomics Program (NCOG) to characterize microbial and plankton community
  composition in the California Current. The dataset covers CalCOFI and California
  Current Ecosystem Long-Term Ecological Research (CCE-LTER) stations off Southern
  and Central California and spans 2014 to 2019, archived across two NCBI BioProject
  deposits (PRJNA555783 for 2014-2016 and PRJNA665326 for 2017-2019, which also includes
  some 2014-2016 samples and extends metatranscriptomics data through 2020). Whole
  water samples were filtered onto 0.2 micrometer filters to capture DNA and RNA at
  four depths, 10 meters, the subsurface chlorophyll maximum layer, 170 meters, and
  515 meters, then sequenced using 16S V4 metabarcoding to identify bacteria and archaea,
  and 18S V4 and V9 metabarcoding to identify eukaryotic plankton such as protists
  and small zooplankton. The same archived deposits also include total mRNA sequencing
  (metatranscriptomics) data from these samples. This dataset supports research identifying
  amplicon sequence variants (ASVs), a method for distinguishing microbial and plankton
  taxa at high resolution, and characterizing community structure and diversity, and
  is intended for researchers studying plankton and microbial ecology in the California
  Current.

