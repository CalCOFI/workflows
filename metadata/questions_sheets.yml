# Provider question sheets — one Google Sheet per active provider (metadata/provider.csv),
# generated from and pulled back into metadata/{provider}/{dataset}/questions.csv by
# scripts/sync_questions_sheets.R. The CSVs in git stay the source of truth for the
# question itself; the sheet is the source of truth for `answer` / `status` /
# `answered_date` / `who` once a provider has typed into it — see CLAUDE.md
# "The question registry convention".
#
# sheet_id / url / created are filled in by `scripts/sync_questions_sheets.R push
# <provider> --execute`, which mints the spreadsheet on its first run for a
# provider. That call needs Google auth (googlesheets4::gs4_auth() as
# bebest@ucsd.edu, or the calcofi-admin service account with the sheet shared to
# it) — this file is committed with placeholders until that run happens.
calcofi:
  sheet_id: ~
  url: ~
  created: ~
