# source: caloos-sheet row 27, 2026-09-05
abstract: CalCOFI Primary Production from 14C Uptake (in Situ) contains measurements
  of phytoplankton photosynthetic production rates from seawater samples collected
  each day near midday during California Current Ecosystem Long-Term Ecological Research
  (CCE-LTER) Process cruises, within the California Current Ecosystem region. The
  dataset spans 2006 to 2021. Water is collected via Niskin bottles from the CTD rosette
  at depths matching specific light levels, determined from Secchi disk measurements
  of light penetration, then incubated on deck under matching simulated light and
  dosed with radioactive carbon-14. The amount of carbon-14 taken up by phytoplankton
  during photosynthesis, after filtering, estimates the rate of primary production,
  reported in micrograms of carbon per liter per day, at each light level sampled
  within the euphotic zone. This dataset supports study of phytoplankton productivity
  and carbon fixation rates in the California Current, for researchers studying primary
  production and ecosystem energy flow.

