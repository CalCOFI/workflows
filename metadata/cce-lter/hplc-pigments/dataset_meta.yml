# source: caloos-sheet row 18, 2026-09-05
abstract: CalCOFI Phytoplankton Community Taxon-Specific Pigments contains concentrations
  of chlorophyll and other pigments used to estimate phytoplankton biomass and taxonomic
  composition, collected during California Current Ecosystem Long-Term Ecological
  Research (CCE-LTER) Process cruises, periodic research cruises distinct from the
  routine quarterly California Cooperative Oceanic Fisheries Investigations (CalCOFI)
  survey. Samples are collected from rosette bottles at three to eight depths in the
  photic zone at stations within the California Current Ecosystem region, spanning
  2006 to 2017. Particulate matter is filtered and frozen at sea, then extracted onshore
  for High Performance Liquid Chromatography (HPLC) analysis, which measures chlorophyll
  and carotenoid pigment concentrations. Chlorophyll a concentration serves as a proxy
  for total phytoplankton biomass, while other taxon-specific pigments are used to
  determine the contribution of different phytoplankton taxa to that biomass. This
  dataset supports characterization of phytoplankton community composition and biomass
  in the California Current, for researchers studying primary producer community structure.

