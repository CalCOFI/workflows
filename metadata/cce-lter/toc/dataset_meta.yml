# source: caloos-sheet row 25, 2026-09-05
abstract: CalCOFI Total Organic Carbon (TOC) contains total organic carbon concentrations,
  combining both dissolved and particulate organic carbon, from water column bottle
  samples collected at multiple depths during California Cooperative Oceanic Fisheries
  Investigations (CalCOFI) cruises at CTD stations, run by the Scripps Institution
  of Oceanography (SIO) as part of the California Current Ecosystem Long-Term Ecological
  Research (CCE-LTER) program. The dataset covers the CalCOFI station grid off Southern
  and Central California and spans 2008 to 2017. TOC is measured onshore in the lab
  and reported as micromoles of carbon per liter of seawater. In open ocean waters,
  particulate organic carbon can be subtracted from TOC to estimate dissolved organic
  carbon, since particles there are typically small and evenly distributed. In coastal
  waters and at stations with high chlorophyll, particles are larger and unevenly
  distributed, so this subtraction does not reliably estimate dissolved organic carbon,
  and samples from the California Current Ecosystem are reported as TOC rather than
  converted. This dataset supports study of organic carbon cycling in coastal and
  open ocean waters of the California Current, for researchers studying carbon dynamics
  in the California Current ecosystem. It complements CalCOFI's Particulate Organic
  Carbon and Nitrogen (POC/PON) dataset, whose values are used together with TOC to
  estimate dissolved organic carbon in open-ocean samples.

