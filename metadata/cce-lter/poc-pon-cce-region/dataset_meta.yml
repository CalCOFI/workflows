# source: caloos-sheet row 26, 2026-09-05
abstract: CalCOFI Nitrate Stable Isotope of Nitrogen and Oxygen contains nitrogen
  and oxygen stable isotope ratios of nitrate, collected from water column bottle
  samples at multiple depths at CTD stations within the California Current Ecosystem
  region, during California Current Ecosystem Long-Term Ecological Research (CCE-LTER)
  Process cruises, periodic research cruises distinct from the routine quarterly California
  Cooperative Oceanic Fisheries Investigations (CalCOFI) survey. The dataset spans
  2006 to ongoing. These isotope ratios, nitrogen-15 and oxygen-18 relative to standard
  references, are used to trace the origin and cycling of nitrate in seawater. This
  dataset supports study of nitrogen cycling and nutrient sources in the California
  Current, for researchers studying ocean biogeochemistry.

