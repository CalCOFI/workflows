# source: WS-R1 2026-09-05 default
visibility: public

# source: condensed from `abstract` below for the calcofi.io card/table, 2026-10-06
description: >
  Particulate organic carbon (POC) and nitrogen (PON) in micromoles per liter
  from Niskin bottle and underway samples on CCE-LTER Process cruises, 2006 to
  2024 and ongoing. Samples are filtered onto glass-fiber filters and analyzed
  onshore by high-temperature combustion.

# source: EML knb-lter-cce.104.13 abstract, checked 2026-10-06 (verbatim)
abstract: >
  Water column bottle samples at multiple depths are taken during CCE Process
  cruises (since 2006, ongoing) at various CTD stations, filtered, and stored at
  -20°C. Measurements of particulate organic carbon (POC) and nitrogen (PON) are
  performed onshore in the lab where samples are acidified, dried and analyzed
  by high-temperature combustion. The sample and tin capsule react with oxygen
  and combust at 1000°C, and the sample is broken down, thus converting organic
  carbon to CO2 and reducing nitrogen oxides to N2 gas. Both gases are measured
  by thermal conductivity. Samples analyzed within the CCE constrain the mean
  C:N ratio of small particulates and by difference relative to measured living
  biomass, the biomass of suspended detritus.

# source: EML knb-lter-cce.104.13 methods (General Methods + Frequency), checked 2026-10-06
methods_md: >
  1-L samples are filtered onto precombusted glass-fiber filters, dried for
  48 h at 60 °C, and analyzed by high-temperature combustion (Perkin Elmer
  Model 2400 Elemental Analyzer) relative to standards and blanks. Frequency:
  selected stations, seasonally. Protocol:
  http://cce.lternet.edu/data/methods-manual/augmented-cruises/particulate-organic-carbon-nitrogen

