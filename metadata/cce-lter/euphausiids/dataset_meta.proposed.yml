# source: caloos-sheet row 21, 2026-09-05
abstract: CalCOFI Euphausiid (Krill) Abundance contains taxonomic abundance counts
  of krill species from samples taken during California Cooperative Oceanic Fisheries
  Investigations (CalCOFI) cruises starting in 1951, enumerated at the Scripps Institution
  of Oceanography (SIO). Since 2004, this taxonomic work has been carried out under
  the California Current Ecosystem Long-Term Ecological Research (CCE-LTER) program,
  funded by the National Science Foundation. Only a limited subset of CalCOFI samples
  have been enumerated taxonomically, primarily from springtime cruises in Southern
  California (CalCOFI lines 77 to 93) with some in Central California (lines 60 to
  73). The dataset spans 1951 to ongoing. Samples are collected as double oblique
  tows, using a bongo net since December 1977 or a ring net before that, fished nominally
  from 210 meters to the surface, depth permitting. This dataset supports tracking
  of krill abundance and community composition, a key prey resource in the California
  Current food web, for researchers studying prey availability for fish, seabirds,
  and marine mammals.
