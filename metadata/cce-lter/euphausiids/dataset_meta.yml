# descriptive metadata for cce-lter_euphausiids -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_cce-lter_euphausiids.qmd
  visibility: public
  description: >
    Species- and life-stage-resolved euphausiid (krill) abundance from
    CalCOFI / CCE-LTER net tows (BTEDB export), 1951-present, one row per
    tow x species x life stage. Supersedes the prior single-Abundance-
    column ingest, which had no taxonomic scope (Q02, now resolved) —
    units remain provisional pending provider confirmation (Q01).
  # source: caloos-sheet row 21, 2026-09-05. Full EML abstract (description
  # above stays the short card-level summary).
  abstract: >
    CalCOFI Euphausiid (Krill) Abundance contains taxonomic abundance counts
    of krill species from samples taken during California Cooperative Oceanic
    Fisheries Investigations (CalCOFI) cruises starting in 1951, enumerated at
    the Scripps Institution of Oceanography (SIO). Since 2004, this taxonomic
    work has been carried out under the California Current Ecosystem
    Long-Term Ecological Research (CCE-LTER) program, funded by the National
    Science Foundation. Only a limited subset of CalCOFI samples have been
    enumerated taxonomically, primarily from springtime cruises in Southern
    California (CalCOFI lines 77 to 93) with some in Central California
    (lines 60 to 73). The dataset spans 1951 to ongoing. Samples are
    collected as double oblique tows, using a bongo net since December 1977
    or a ring net before that, fished nominally from 210 meters to the
    surface, depth permitting. This dataset supports tracking of krill
    abundance and community composition, a key prey resource in the
    California Current food web, for researchers studying prey availability
    for fish, seabirds, and marine mammals.
