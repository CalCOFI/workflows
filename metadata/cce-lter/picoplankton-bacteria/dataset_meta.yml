# descriptive metadata for cce-lter_picoplankton-bacteria -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_cce-lter_picoplankton-bacteria.qmd
  visibility: public
  description: >
    Picophytoplankton (Prochlorococcus, Synechococcus, picoeukaryotes) and
    heterotrophic bacteria abundances analyzed by flow cytometry (FCM) from
    CCE-CalCOFI Augmented cruises in the California Current System,
    2004-2023 (ongoing). Seawater collected from Niskin bottles at 3-8
    depths per station; cells fixed shipboard with paraformaldehyde,
    stained with a DNA-specific dye, and enumerated on an Altra flow
    cytometer with dual argon-ion lasers.
  citation_main: "Landry, M. (2004-2023). Picoplankton and Bacteria Abundance (CalCOFI Cruise). CCE LTER."
  link_calcofi_org: ""
  link_data_source: "https://oceaninformatics.ucsd.edu/datazoo/catalogs/ccelter/datasets/159"
  link_others:
    - "http://dx.doi.org/10.6073/pasta/bc2915c8448214d2841b064a7414064b"
  # no license/data-use-policy text is stated on the DataZoo dataset page
  # (https://oceaninformatics.ucsd.edu/datazoo/catalogs/ccelter/datasets/159,
  # checked 2026-09-03 — only a generic site copyright line, unlike zoodb/
  # zooscan's dedicated "Data Use Policy" panel); left empty, see
  # metadata/cce-lter/picoplankton-bacteria/questions.csv Q06 (proposed to Landry)
  license: ""
  pi_names: Michael Landry
  # GCMD Science Keywords, proposed by WS-R1 from the category + measurement types;
  # source: https://gcmd.earthdata.nasa.gov/KeywordViewer/ (GCMD KMS export), checked 2026-09-05
  keywords_gcmd:
    - "EARTH SCIENCE > BIOLOGICAL CLASSIFICATION > BACTERIA/ARCHAEA"
    - "EARTH SCIENCE > BIOLOGICAL CLASSIFICATION > PROTISTS > PLANKTON > PHYTOPLANKTON"
