# descriptive metadata for cce-lter_picoplankton-bacteria -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_cce-lter_picoplankton-bacteria.qmd
  visibility: public
  description: >
    Picophytoplankton (Prochlorococcus, Synechococcus, picoeukaryotes) and
    heterotrophic bacteria abundances analyzed by flow cytometry (FCM) from
    CCE-CalCOFI Augmented cruises in the California Current System,
    2004-2023 (ongoing). Seawater collected from Niskin bottles at 3-8
    depths per station; cells fixed shipboard with paraformaldehyde,
    stained with a DNA-specific dye, and enumerated on an Altra flow
    cytometer with dual argon-ion lasers.
  # source: caloos-sheet row 16, 2026-09-05. Full EML abstract (description
  # above stays the short card-level summary).
  abstract: >
    CalCOFI Heterotrophic Bacteria and Picoautotroph Abundance data contains
    cell counts of picophytoplankton and heterotrophic bacteria collected at
    CalCOFI stations within the California Current Ecosystem, as part of the
    California Cooperative Oceanic Fisheries Investigations (CalCOFI) and
    California Current Ecosystem Long-Term Ecological Research (CCE-LTER)
    programs, run by the Scripps Institution of Oceanography (SIO), to
    characterize the microbial base of the food web. The dataset covers the
    CalCOFI station grid off Southern and Central California and spans 2004
    to 2023. Seawater is collected from Niskin bottles at 3 to 8 depths per
    station, and cells are fixed aboard the ship with paraformaldehyde, then
    stained in the lab with a DNA-specific dye. An Altra flow cytometer,
    using argon ion lasers and a syringe pump for volumetric sample delivery,
    counts three groups of photoautotrophs, Prochlorococcus, Synechococcus,
    and pico-eukaryotes, and the heterotrophic prokaryote assemblage known as
    H-Bact. This dataset supports study of microbial plankton community
    structure and lower trophic level dynamics in the California Current
    ecosystem. It complements CalCOFI's phytoplankton community datasets,
    which characterize larger phytoplankton not captured by this
    picoplankton and bacteria size range.
