# source: caloos-sheet row 16, 2026-09-05
abstract: CalCOFI Heterotrophic Bacteria and Picoautotroph Abundance data contains
  cell counts of picophytoplankton and heterotrophic bacteria collected at CalCOFI
  stations within the California Current Ecosystem, as part of the California Cooperative
  Oceanic Fisheries Investigations (CalCOFI) and California Current Ecosystem Long-Term
  Ecological Research (CCE-LTER) programs, run by the Scripps Institution of Oceanography
  (SIO), to characterize the microbial base of the food web. The dataset covers the
  CalCOFI station grid off Southern and Central California and spans 2004 to 2023.
  Seawater is collected from Niskin bottles at 3 to 8 depths per station, and cells
  are fixed aboard the ship with paraformaldehyde, then stained in the lab with a
  DNA-specific dye. An Altra flow cytometer, using argon ion lasers and a syringe
  pump for volumetric sample delivery, counts three groups of photoautotrophs, Prochlorococcus,
  Synechococcus, and pico-eukaryotes, and the heterotrophic prokaryote assemblage
  known as H-Bact. This dataset supports study of microbial plankton community structure
  and lower trophic level dynamics in the California Current ecosystem. It complements
  CalCOFI's phytoplankton community datasets, which characterize larger phytoplankton
  not captured by this picoplankton and bacteria size range.
