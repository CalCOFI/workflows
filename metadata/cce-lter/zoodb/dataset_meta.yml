# descriptive metadata for cce-lter_zoodb -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_cce-lter_zoodb.qmd
  visibility: public
  description: >
    Holoplankton abundance and carbon biomass by 33 higher taxa (copepods
    to family, plus amphipods, chaetognaths, salps, pyrosomes, pteropods,
    ostracods, foraminifera, radiolaria and more) from CalCOFI net tows,
    1951-2021, enumerated by microscopy (Ohman Lab / SIO Pelagic Invertebrate
    Collection). One row per (sample, taxon, measurement_type); unpooled tows
    are station-resolved, pooled samples are per-cruise regional composites.
    Raw (uncorrected) abundance per 1000 m3 and per m2, plus biomass mg C/m2.
  # no formal author/year/title citation is stated anywhere on the portal —
  # left empty; see metadata/cce-lter/zoodb/questions.csv Q10 (proposed to
  # Ohman/Sala). checked 2026-09-03
  citation_main: ""
  # source: caloos-sheet row 20, 2026-09-05. Full EML abstract (description
  # above stays the short card-level summary).
  abstract: >
    CalCOFI Permanent Zooplankton (Holoplankton) Community Taxonomic Database
    (ZooDb) contains taxonomic identifications and abundance data for
    holoplankton, zooplankton that spend their entire life cycle as plankton,
    compiled from California Cooperative Oceanic Fisheries Investigations
    (CalCOFI) net tow samples, analyzed by SIO taxonomists under Mark Ohman's
    direction as part of the California Current Ecosystem Long-Term
    Ecological Research (CCE-LTER) program. Coverage is concentrated in two
    regions, Southern California (CalCOFI lines 80 to 93) and Central
    California (lines 60 to 70), rather than the full CalCOFI station grid,
    and most samples come from springtime cruises between 1951 and 2008,
    though copepod counts continue to present. Samples are double oblique
    tows, using a 1-meter ring net through 1977 and a bongo net since, fished
    to a maximum depth of 210 meters. Because coverage varies by year and
    taxon, users should check per-cruise coverage tables before building
    species time series. This dataset supports long-term tracking of
    holoplankton species composition in the California Current and is
    extended since 2006 by CalCOFI's ZooScan imagery dataset, which adds
    faster automated identification from the same net tow samples.
