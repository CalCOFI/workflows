# source: caloos-sheet row 20, 2026-09-05
abstract: CalCOFI Permanent Zooplankton (Holoplankton) Community Taxonomic Database
  (ZooDb) contains taxonomic identifications and abundance data for holoplankton,
  zooplankton that spend their entire life cycle as plankton, compiled from California
  Cooperative Oceanic Fisheries Investigations (CalCOFI) net tow samples, analyzed
  by SIO taxonomists under Mark Ohman's direction as part of the California Current
  Ecosystem Long-Term Ecological Research (CCE-LTER) program. Coverage is concentrated
  in two regions, Southern California (CalCOFI lines 80 to 93) and Central California
  (lines 60 to 70), rather than the full CalCOFI station grid, and most samples come
  from springtime cruises between 1951 and 2008, though copepod counts continue to
  present. Samples are double oblique tows, using a 1-meter ring net through 1977
  and a bongo net since, fished to a maximum depth of 210 meters. Because coverage
  varies by year and taxon, users should check per-cruise coverage tables before building
  species time series. This dataset supports long-term tracking of holoplankton species
  composition in the California Current and is extended since 2006 by CalCOFI's ZooScan
  imagery dataset, which adds faster automated identification from the same net tow
  samples.
