visibility: public

# source: condensed from `abstract` below for the calcofi.io card/table, 2026-10-06
description: >
  Particulate organic carbon (POC) and nitrogen (PON) in micromoles per liter
  from Niskin bottle samples at multiple depths on CalCOFI cruises, 2004 to
  2023 and ongoing. Samples are filtered onto glass-fiber filters and analyzed
  onshore by high-temperature combustion.

# source: caloos-sheet row 24, 2026-09-05
abstract: CalCOFI Particulate Organic Carbon and Nitrogen (POC/PON) contains concentrations
  of particulate organic carbon and nitrogen from water column bottle samples collected
  at multiple depths during California Cooperative Oceanic Fisheries Investigations
  (CalCOFI) cruises since 2004, run by the Scripps Institution of Oceanography (SIO)
  as part of the California Current Ecosystem Long-Term Ecological Research (CCE-LTER)
  program. The dataset covers the CalCOFI station grid off Southern and Central California
  and spans 2004 to ongoing. Samples are filtered at CTD stations, frozen at negative
  20 degrees Celsius, then acidified, dried, and analyzed onshore by high-temperature
  combustion at 1,000 degrees Celsius, which converts organic carbon to carbon dioxide
  and reduces nitrogen oxides to nitrogen gas, both measured by thermal conductivity.
  These measurements constrain the mean carbon-to-nitrogen ratio of small particulates
  and, compared against measured living biomass, estimate the biomass of suspended
  non-living detritus. This dataset supports study of organic carbon cycling and detrital
  biomass in the California Current, for researchers studying particulate organic
  matter dynamics. Its particulate organic carbon values are also used together with
  CalCOFI's Total Organic Carbon dataset to estimate dissolved organic carbon in open-ocean
  samples.

# source: EML knb-lter-cce.54.10 methods (General Methods + Frequency), checked 2026-10-06
methods_md: >
  1-L water samples from the CTD rosette's Niskin bottles are filtered onto
  precombusted glass-fiber filters, stored at -20 °C, dried for 48 h at 60 °C,
  acidified, and analyzed by high-temperature combustion (Perkin Elmer Model
  2400 Elemental Analyzer) relative to standards and blanks. Carbon is measured
  as CO2 and nitrogen as N2 by thermal conductivity. Frequency: selected
  stations, seasonally. Protocol:
  http://cce.lternet.edu/data/methods-manual/augmented-cruises/particulate-organic-carbon-nitrogen

