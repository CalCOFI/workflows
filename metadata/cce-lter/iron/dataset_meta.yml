# source: caloos-sheet row 39, 2026-09-05
abstract: CalCOFI Dissolved and Total Iron (Fe) Concentrations contains measurements
  of dissolved and total iron and results of shipboard iron-addition bioassays, collected
  during California Cooperative Oceanic Fisheries Investigations (CalCOFI) cruises
  as part of the California Current Ecosystem Long-Term Ecological Research (CCE-LTER)
  program, with Katherine Barbeau (Scripps Institution of Oceanography (SIO)) as lead
  contributor, to investigate the potential for phytoplankton iron limitation in the
  California Current System. The dataset covers coastal transition zone stations of
  the southern California Current System, a weak-upwelling regime relatively low in
  nutrients and chlorophyll, and spans November 2002 to July 2004 (completed). Surface
  (0 m) seawater samples were collected using a pole sampler and analyzed for dissolved
  iron using an FeLume flow-injection analysis system; a subset of samples also include
  results from shipboard iron-addition bioassays tracking the chlorophyll a response
  to added iron (Chla response to Fe+). This dataset supports research on iron limitation
  and its effects on phytoplankton growth in the California Current, for researchers
  studying nutrient controls on primary productivity in low-nutrient, low-chlorophyll
  coastal waters.

