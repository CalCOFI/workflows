# source: EML knb-lter-cce.316.1 Quality Control flag + source inspection 2026-10-06
quality_control_md: >-
  QC flags present: Yes, one per sample (0-3, see methods), published as
  measurement_qual (code set hplc-pigments-calcofi in measurement_qual.csv).
  Rows with a conflicting depth or with values crossed between QC flags, and one
  carotene value of 10,575 ug/L, are held out by the ingest (Q01, Q02, Q04).

