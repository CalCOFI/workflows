# source: WS-R1 2026-09-05 default
visibility: public

# source: condensed from `abstract` below for the calcofi.io card/table, 2026-10-06
description: >
  Chlorophyll and carotenoid pigment concentrations (ug/L) measured by HPLC on
  Niskin bottle samples from three to eight depths in the photic zone on CalCOFI
  cruises, 2002 to 2023 and ongoing. Analysed by the Goericke Lab (SIO) through
  2014 and by Horn Point Laboratory (UMCES) since.

# source: EML knb-lter-cce.316.1 abstract, checked 2026-10-06 (verbatim)
abstract: >
  High Performance Liquid Chromatography (HPLC) samples are collected from
  rosette bottles (from three to eight different depths in the photic zone) at
  stations located within the CCE region on CalCOFI cruises (since 2002,
  ongoing). The HPLC method is used to measure concentrations of chlorophylls
  and carotenoids in samples of particulate matter, which includes filtering
  and freezing the filter while at sea. The taxon-specific phyto-pigments are
  extracted back onshore. Concentrations of chlorophyll a are used as a proxy
  for phytoplankton biomass and concentrations of other taxon-specific pigments
  are used to determine contributions of phytoplankton taxa to total
  phytoplankton biomass.

# source: EML knb-lter-cce.316.1 methods (General Methods, Quality Control), checked 2026-10-06, condensed
methods_md: >
  Samples are concentrated on GF/F filters by vacuum filtration and stored in
  liquid N2. Pigments are extracted in acetone and analyzed by reverse-phase
  HPLC for major chlorophylls and taxon-specific carotenoids (Goericke & Repeta
  1993). 2002-2014 samples were analyzed by the Goericke Lab (SIO), 2014 on by
  the analytical facility at Horn Point Laboratory (UMCES). A 2023
  inter-laboratory comparison found Chl a, divinyl Chl a, Chl b, Chl c,
  fucoxanthin, hexanoyloxyfucoxanthin and alloxanthin reasonably comparable;
  diadinoxanthin, peridinin, zeaxanthin and butanoyloxyfucoxanthin with
  sample-to-sample differences but no distinct bias; neoxanthin and
  prasinoxanthin typically higher at UMCES. Every sample carries a quality flag:
  0 none, 1 TChl a <= 0, 2 accessory-pigment to TChl a ratio outside 2 SD of the
  MAREDAT relationship (Peloquin et al. 2013), 3 HPLC vs fluorometric TChl a
  outside 2 SD of their relationship (~5% of samples; not necessarily wrong).
  No data were removed for a flag. Protocol:
  https://ccelter.ucsd.edu/taxon-specific-photo-pigments-2023/

