# source: caloos-sheet row 19, 2026-09-05
abstract: CalCOFI Permanent Zooplankton (Holoplankton) Community Imagery (ZooScan)
  contains digital images and derived abundance data for holoplankton, zooplankton
  that spend their entire life cycle as plankton, identified from net tow samples
  collected during California Cooperative Oceanic Fisheries Investigations (CalCOFI)
  cruises, run by the Scripps Institution of Oceanography (SIO) as part of the California
  Current Ecosystem Long-Term Ecological Research (CCE-LTER) program. The dataset
  covers the CalCOFI station grid off Southern and Central California and spans 2006
  to ongoing. Zooplankton are manually separated to avoid overlap and imaged on the
  ZooScan, a digital scanning system, and each image is automatically classified using
  a Random Forest algorithm trained on manually sorted reference images, with results
  checked and corrected by technicians afterward. Data can be viewed by cruise, station,
  CalCOFI line, day or night survey, and biomass category using the source's time
  series plotting tool. This dataset supports large-scale tracking of zooplankton
  community composition and abundance in the California Current, for researchers studying
  zooplankton community trends. It complements CalCOFI's longer-running visual identification
  record (ZooDb, since 1951) with a faster, automated imaging method from the same
  net tow samples.
