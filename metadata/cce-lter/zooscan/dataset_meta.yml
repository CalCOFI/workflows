# descriptive metadata for cce-lter_zooscan -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_cce-lter_zooscan.qmd
  visibility: public
  description: >
    Zooplankton abundance, carbon biomass, and size (Feret diameter, individual
    carbon content) from ZooScan optical imaging of CalCOFI / CCE-LTER PRPOOS
    net tows on lines 80, 87 and 90, 2005-present, machine-classified into 23
    bioclasses (copepod groups, euphausiids, chaetognaths, appendicularians,
    salps, doliolids, pteropods, rhizaria and more). One row per
    (sample, taxon, measurement_type); per-station tows. Source: SIO Ocean
    Informatics ZooScan portal (Ohman Lab; interface by Marina Frants).
  # no formal author/year/title citation is stated anywhere on the portal —
  # left empty; see metadata/cce-lter/zooscan/questions.csv Q06 (proposed to
  # Ohman/Frants). checked 2026-09-03
  citation_main: ""
  link_calcofi_org: "https://calcofi.org/data/marine-ecosystem-data/zooplankton/"
  link_data_source: "https://oceaninformatics.ucsd.edu/zooscandb/"
  link_others: []
  # NOT CC-BY-4.0: the portal's "Data Use Policy" section is bespoke, non-CC
  # text: "intended for scholarly use... Use or reproduction of any materials
  # herein for any commercial purpose is prohibited without prior written
  # permission from Dr. Mark D. Ohman."
  # source: https://oceaninformatics.ucsd.edu/zooscandb/ (Data Use Policy), checked 2026-09-03
  license: custom
  license_url: https://oceaninformatics.ucsd.edu/zooscandb/
  # moved from citation_others (2026-09-03): this is credit prose the portal's
  # "Data Acknowledgement Policy" requires be included in any use, not an
  # additional citation.
  # source: https://oceaninformatics.ucsd.edu/zooscandb/ (Data Acknowledgement Policy), checked 2026-09-03
  acknowledgement: "Plankton sample analysis supported by NSF grants to M.D. Ohman and the CCE-LTER site."
  pi_names: Mark D. Ohman; Marina Frants
  # GCMD Science Keywords, proposed by WS-R1 from the category + measurement types;
  # source: https://gcmd.earthdata.nasa.gov/KeywordViewer/ (GCMD KMS export), checked 2026-09-05
  keywords_gcmd:
    - "EARTH SCIENCE > BIOSPHERE > ECOSYSTEMS > AQUATIC ECOSYSTEMS > PLANKTON > ZOOPLANKTON"
    - "EARTH SCIENCE > BIOLOGICAL CLASSIFICATION > ANIMALS/INVERTEBRATES > ARTHROPODS > CRUSTACEANS"
