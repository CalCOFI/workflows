quality_control_md: >-
  Instrument data quality (filter volume, flow rate, focus and similar) is
  checked following the CalOOS IFCB SOP QC protocols. Bins flagged `skip` in the
  provider's metadata are removed. Images are classified automatically;
  class-level classifier accuracy is reported per taxon in the source
  (`Autoclass Accuracy`) but not published here pending the provider (Q06).

