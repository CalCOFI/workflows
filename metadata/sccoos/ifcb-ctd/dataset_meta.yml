# source: email thread, L. Hou 2026-09-30 ("I agree it would be really nice to get
# the IFCB data there too") + R. Swalethorp 2026-09-30 (plans to serve and
# visualize the data on calcofi.io). To be confirmed with the provider (Q01).
visibility: public

# source: provider's summary workbook + IFCB_CalCOFI_summary.ipynb, read 2026-10-23
description: >
  Phytoplankton abundance and biovolume from an Imaging FlowCytobot (IFCB) run on
  water collected from the CalCOFI CTD rosette, Aug 2022 - Jul 2026 (10 cruises,
  671 samples). Cells are imaged, classified by an image classifier, and counted
  per taxon and per equivalent-spherical-diameter size class; taxa are matched to
  WoRMS.

# source: provider's IFCB_CalCOFI_summary.ipynb (method, units, size classes) and
# the summary workbook (extent), read 2026-10-23
abstract: >
  Imaging FlowCytobot (IFCB) phytoplankton summary for CalCOFI CTD water samples.
  Each IFCB sample (a "bin") is a measured volume of seawater from a CTD rosette
  bottle, typically at the surface and at the deep chlorophyll maximum, run
  through the instrument aboard CalCOFI cruises from August 2022 to July 2026.
  Every imaged cell is assigned to a class by an image classifier (autoclass),
  and the classes are matched to WoRMS. The summary reports, per bin, taxon and
  equivalent spherical diameter (ESD) size class (<10, 10-20, 20-40, >40 um),
  the number of cells imaged, the abundance (cells per ml analysed), and the mean
  and standard deviation of cell biovolume (um3) and ESD (um). Non-cell classes
  (bubbles, detritus, beads and similar) are removed upstream. The time series is
  short and has gaps (the instrument was not run on every cruise).

# source: IFCB_CalCOFI_summary.ipynb, settings and aggregation cells, read 2026-10-23
methods_md: >
  Seawater from CTD rosette bottles is run through an Imaging FlowCytobot
  (IFCB). Volume analysed is 0.25 ml/min x (runTime - inhibitTime) / 60, from the
  instrument header. Each image is classified to its highest-scoring class by an
  image classifier (autoclass version 1), joined to its size features, converted
  from pixels to um (3.4 pixels per um), and grouped by taxon and ESD size class
  ([0,10), [10,20), [20,40), [40,inf) um). Abundance is images / volume analysed.
  Classes are matched to WoRMS (CalCOFI_IFCB_WoRMS_match.xlsx). Samples flagged
  `skip` in the provider's metadata are dropped.

