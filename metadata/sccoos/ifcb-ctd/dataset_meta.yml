# source: caloos-sheet row 31, 2026-09-05
abstract: CalCOFI Imaging FlowCytobot (IFCB) Images of Chloroplast-Containing Plankton
  from CTD contains high-resolution digital images of chloroplast-containing plankton
  and other suspended particles, collected during California Cooperative Oceanic Fisheries
  Investigations (CalCOFI) CTD casts to characterize fine-scale plankton community
  composition. The dataset covers the southern California Current and spans 2022 to
  ongoing, since the Imaging FlowCytobot (IFCB) was first deployed on CalCOFI cruises.
  Discrete water samples are collected from 10 meters and the chlorophyll maximum
  depth during CTD casts and imaged using the IFCB, an automated flow cytometer that
  combines flow cytometry and video technology to photograph individual suspended
  particles. Images are processed to estimate particle volume and identity, along
  with geolocation, sampling conditions, and instrument metadata, allowing estimates
  of plankton abundance, biovolume, and carbon content. This dataset supports research
  on fine-scale plankton community composition and spatial and temporal variability,
  and is intended for researchers studying phytoplankton ecology in the California
  Current.

