# next_step dropped now that the dataset is an active ingest, as iron did). The
# description / abstract / methods below describe the SUMMARY TABLE that is
# ingested, not the raw IFCB images the old abstract described.
#
# Sources: the provider's files and email thread (Sep 2026), and the CalOOS
# working-draft dataset sheet, row 31 "IFCB-CTD" (read 2026-10-23). The sheet's
# license and DOI describe the CalOOS-hosted IFCB data; whether they cover the
