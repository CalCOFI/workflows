# source: caloos-sheet row 32, 2026-09-05
abstract: CalCOFI Imaging FlowCytobot (IFCB) Images of Chloroplast-Containing Plankton
  from Underway data contains high-resolution digital images of chloroplast-containing
  plankton and other suspended particles, collected continuously during California
  Cooperative Oceanic Fisheries Investigations (CalCOFI) cruises to characterize fine-scale
  plankton community composition. The dataset covers the southern California Current
  and spans 2022 to ongoing, since the Imaging FlowCytobot (IFCB) was first deployed
  on CalCOFI cruises. Seawater is drawn continuously through the ship's underway system
  and imaged by the IFCB in small increments approximately every 20 to 25 minutes,
  using an automated flow cytometer that combines flow cytometry and video technology
  to photograph individual suspended particles. Images are processed to estimate particle
  volume and identity, along with geolocation, sampling conditions, and instrument
  metadata, allowing estimates of plankton abundance, biovolume, and carbon content.
  This dataset supports research on fine-scale plankton community composition and
  spatial and temporal variability, and is intended for researchers studying phytoplankton
  ecology in the California Current.

