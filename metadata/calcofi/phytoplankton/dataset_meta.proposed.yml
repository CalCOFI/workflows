# source: caloos-sheet row 17, 2026-09-05
abstract: CalCOFI Phytoplankton Community Composition from Visual Microscopy contains
  abundance counts of 385 phytoplankton taxonomic categories, identified to species
  where possible, collected quarterly at 34 of the 66 routine stations of the California
  Cooperative Oceanic Fisheries Investigations (CalCOFI) program, run by the Scripps
  Institution of Oceanography (SIO) as part of the California Current Ecosystem Long-Term
  Ecological Research (CCE-LTER) program. The dataset covers the CalCOFI station grid
  off Southern and Central California and spans summer 1996 through autumn 2022. At
  each station, 30 ml water samples are collected from the mixed layer (5 to 15 meters
  depth), preserved with 1% buffered formalin, and pooled into four regional composites,
  Northeast Inshore, Southeast Inshore, California Current Alley, and Offshore, rather
  than reported per individual station. Cells are counted using an inverted phase-contrast
  microscope at 100x and 250x magnification, sorted into seven major taxonomic categories.
  This dataset supports characterization of phytoplankton community composition and
  diversity across the California Current, for researchers studying primary producer
  community structure.
