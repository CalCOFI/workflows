# descriptive metadata for calcofi_ctd-cast -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_calcofi_ctd-cast.qmd
  visibility: public
  description: >
    CTD downcast profiles with temperature, salinity, oxygen, fluorescence,
    and other sensors at standard depths. 1 m-binned final data for 1993-2002
    come from the SIO-CalCOFI Technical Group's own archive (J. Wilkinson),
    which covers the decade calcofi.org does not publish finals for; 1998 and
    2003 onward come from calcofi.org. Where both publish the same cruise,
    calcofi.org is used; the two agree on 130 of 140 comparable files, and the
    four cruises that differ are recorded in question calcofi_ctd-cast_20.
  citation_main: "CalCOFI. (2023). CalCOFI CTD Cast Files. CalCOFI.org."
  link_calcofi_org: https://calcofi.org/data/oceanographic-data/ctd-cast-files/
  link_data_source: https://calcofi.org/data/oceanographic-data/ctd-cast-files/
  # calcofi.org states no license anywhere on this page (checked 2026-09-03);
  # left empty, see metadata/calcofi/ctd-cast/questions.csv Q28 (proposed
  # CC-BY-4.0 to Rasmus Swalethorp)
  license: ""
  # no PI stated by the source; left empty, see questions.csv Q29 (proposed
  # row naming Rasmus Swalethorp + Benjamin Gire, Oceanographic Technician,
  # CalCOFI/SIO — per his 2026-08-21 email signature, bmgire@ucsd.edu — as the
  # people to confirm, not asserted here)
  pi_names: ""
  # GCMD Science Keywords, proposed by WS-R1 from the category + measurement types;
  # source: https://gcmd.earthdata.nasa.gov/KeywordViewer/ (GCMD KMS export), checked 2026-09-05
  keywords_gcmd:
    - "EARTH SCIENCE > OCEANS > OCEAN TEMPERATURE > WATER TEMPERATURE"
    - "EARTH SCIENCE > OCEANS > SALINITY/DENSITY > OCEAN SALINITY"
    - "EARTH SCIENCE > OCEANS > OCEAN CHEMISTRY > OXYGEN"
    - "EARTH SCIENCE > OCEANS > OCEAN PRESSURE > WATER PRESSURE"
