# descriptive metadata for calcofi_ctd-cast -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_calcofi_ctd-cast.qmd
  visibility: public
  description: >
    CTD downcast profiles with temperature, salinity, oxygen, fluorescence,
    and other sensors at standard depths. 1 m-binned final data for 1993-2002
    come from the SIO-CalCOFI Technical Group's own archive (J. Wilkinson),
    which covers the decade calcofi.org does not publish finals for; 1998 and
    2003 onward come from calcofi.org. Where both publish the same cruise,
    calcofi.org is used; the two agree on 130 of 140 comparable files, and the
    four cruises that differ are recorded in question calcofi_ctd-cast_20.
  # source: caloos-sheet row 12, 2026-09-05. Full EML abstract (description
  # above stays the short card-level summary).
  abstract: >
    CalCOFI Hydrographic CTD Cast Profile Data contains water-column profiles
    from CTD (conductivity-temperature-depth) sensor casts taken during
    California Cooperative Oceanic Fisheries Investigations (CalCOFI)
    cruises, conducted by the Scripps Institution of Oceanography (SIO), to
    characterize the vertical structure of ocean conditions at each station.
    The dataset covers the CalCOFI station grid off Southern and Central
    California and spans 1990 to ongoing, with cruises conducted quarterly.
    Each cast records temperature, conductivity and salinity, dissolved
    oxygen, fluorescence and chlorophyll-a, and nitrate at 1-meter depth
    resolution. Data are available at three processing levels, raw,
    preliminary 1-meter-binned, and final 1-meter-binned, with final data
    passed through CalCOFI's quality control process, including
    cruise-correction and station-correction using comparisons with bottle
    sample data. This dataset supports detailed water-column characterization
    for researchers studying ocean conditions during CalCOFI cruises. It
    complements the CalCOFI bottle dataset, which provides the discrete
    water-sample chemistry used to calibrate these CTD sensor profiles, and
    serves as the calibrated alternative to the NOAA additional CTD dataset.
  citation_main: "CalCOFI. (2023). CalCOFI CTD Cast Files. CalCOFI.org."
