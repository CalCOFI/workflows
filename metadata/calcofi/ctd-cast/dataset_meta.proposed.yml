# source: caloos-sheet row 12, 2026-09-05
abstract: CalCOFI Hydrographic CTD Cast Profile Data contains water-column profiles
  from CTD (conductivity-temperature-depth) sensor casts taken during California Cooperative
  Oceanic Fisheries Investigations (CalCOFI) cruises, conducted by the Scripps Institution
  of Oceanography (SIO), to characterize the vertical structure of ocean conditions
  at each station. The dataset covers the CalCOFI station grid off Southern and Central
  California and spans 1990 to ongoing, with cruises conducted quarterly. Each cast
  records temperature, conductivity and salinity, dissolved oxygen, fluorescence and
  chlorophyll-a, and nitrate at 1-meter depth resolution. Data are available at three
  processing levels, raw, preliminary 1-meter-binned, and final 1-meter-binned, with
  final data passed through CalCOFI's quality control process, including cruise-correction
  and station-correction using comparisons with bottle sample data. This dataset supports
  detailed water-column characterization for researchers studying ocean conditions
  during CalCOFI cruises. It complements the CalCOFI bottle dataset, which provides
  the discrete water-sample chemistry used to calibrate these CTD sensor profiles,
  and serves as the calibrated alternative to the NOAA additional CTD dataset.
