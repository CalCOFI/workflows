# source: caloos-sheet row 29, 2026-09-05
abstract: CalCOFI Carbonate chemistry data from CTD Bottle Data contains discrete
  profile measurements of dissolved inorganic carbon, total alkalinity, water temperature,
  and salinity, collected during California Cooperative Oceanic Fisheries Investigations
  (CalCOFI) cruises on multiple research ships. The dataset covers the Northeast Pacific
  Ocean coastal area, including the CalCOFI station grid, and spans 1983 to 2021,
  with records assembled from four separate datasets held at Scripps Institution of
  Oceanography (SIO). The data have been quality controlled for consistency using
  World Ocean Circulation Experiment (WOCE) flagging routines, a standard method for
  identifying and flagging errors in ocean chemistry measurements. This dataset supports
  research on ocean acidification and changes in ocean carbonate chemistry, and is
  intended for researchers studying long-term carbon cycle trends in the California
  Current.
