# descriptive metadata for calcofi_dic -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_calcofi_dic.qmd
  visibility: public
  description: >
    Discrete profile dissolved inorganic carbon (DIC) and total alkalinity
    (TA) from CalCOFI Niskin bottle samples, quality-controlled using WOCE
    flagging.
  # source: caloos-sheet row 29, 2026-09-05. Full EML abstract (description
  # above stays the short card-level summary).
  abstract: >
    CalCOFI Carbonate chemistry data from CTD Bottle Data contains discrete
    profile measurements of dissolved inorganic carbon, total alkalinity,
    water temperature, and salinity, collected during California Cooperative
    Oceanic Fisheries Investigations (CalCOFI) cruises on multiple research
    ships. The dataset covers the Northeast Pacific Ocean coastal area,
    including the CalCOFI station grid, and spans 1983 to 2021, with records
    assembled from four separate datasets held at Scripps Institution of
    Oceanography (SIO). The data have been quality controlled for
    consistency using World Ocean Circulation Experiment (WOCE) flagging
    routines, a standard method for identifying and flagging errors in ocean
    chemistry measurements. This dataset supports research on ocean
    acidification and changes in ocean carbonate chemistry, and is intended
    for researchers studying long-term carbon cycle trends in the California
    Current.
