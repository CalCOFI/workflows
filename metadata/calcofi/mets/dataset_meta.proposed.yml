# source: caloos-sheet row 15, 2026-09-05
abstract: CalCOFI Underway Surface Meteorological and Oceanographic Data (METS) contains
  continuously recorded surface ocean and weather measurements collected while the
  ship is underway between CalCOFI stations, as part of the California Cooperative
  Oceanic Fisheries Investigations (CalCOFI) program, conducted by the Scripps Institution
  of Oceanography (SIO). The dataset covers the CalCOFI station grid off Southern
  and Central California and spans 2004 to 2022. The ship's underway seawater system
  continuously measures temperature, salinity, dissolved oxygen, and chlorophyll fluorescence,
  while onboard weather instruments record wind speed and direction, air temperature,
  atmospheric pressure, and solar radiation. Temperature, salinity, and chlorophyll
  fluorescence are calibrated against CalCOFI's 0 to 7 meter bottle measurements using
  polynomial or linear regression, and the corrected values replace the raw sensor
  readings in the final data. Data quality varies by cruise, with chlorophyll and
  salinity data unavailable for some cruises. This dataset supports characterization
  of surface ocean conditions along the CalCOFI cruise track, for researchers studying
  environmental variability across CalCOFI surveys.
