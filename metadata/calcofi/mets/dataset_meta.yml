# descriptive metadata for calcofi_mets -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_calcofi_mets.qmd
  visibility: public
  description: >
    Shipboard underway thermosalinograph (TSG) and meteorology data,
    ~1-minute resolution, recorded continuously along the cruise track.
  # no year: calcofi.org states no publication date and the files are scraped per
  # cruise, so there is no dated export to cite — see questions.csv Q31 (proposed
  # access-year form). Left as-is; check_dataset_citation() reports no_year, exempt.
  citation_main: "CalCOFI. Underway (METS) TSG/Meteorology Data. CalCOFI.org."
  link_calcofi_org: https://calcofi.org/data/oceanographic-data/underway/
  link_data_source: https://calcofi.org/data/oceanographic-data/underway/
  # calcofi.org states no license anywhere on this page (checked 2026-09-03);
  # left empty, see metadata/calcofi/mets/questions.csv Q29 (proposed
  # CC-BY-4.0 to Rasmus Swalethorp)
  license: ""
  # no PI stated by the source; left empty, see questions.csv Q30 (proposed
  # Rasmus Swalethorp)
  pi_names: ""
  # GCMD Science Keywords, proposed by WS-R1 from the category + measurement types;
  # source: https://gcmd.earthdata.nasa.gov/KeywordViewer/ (GCMD KMS export), checked 2026-09-05
  keywords_gcmd:
    - "EARTH SCIENCE > ATMOSPHERE > ATMOSPHERIC WINDS"
    - "EARTH SCIENCE > ATMOSPHERE > ATMOSPHERIC TEMPERATURE > SURFACE TEMPERATURE > AIR TEMPERATURE"
    - "EARTH SCIENCE > ATMOSPHERE > ATMOSPHERIC PRESSURE > SURFACE PRESSURE"
    - "EARTH SCIENCE > OCEANS > OCEAN OPTICS > OCEAN COLOR"
    - "EARTH SCIENCE > OCEANS > OCEAN TEMPERATURE > WATER TEMPERATURE"
