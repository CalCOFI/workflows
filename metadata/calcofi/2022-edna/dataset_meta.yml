# descriptive metadata for calcofi_2022-edna -- provider-editable (Google Sheet
# tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys
# (provider/dataset/category/color) stay in ingest_calcofi_2022-edna.qmd
visibility: public
description: >
  eDNA metabarcoding survey of vertebrates from water samples collected during
  the October 2022 CalCOFI cruise. Water filters from CalCOFI/GEMCAP stations
  off Southern California were run through one or two molecular assays: a
  mitochondrial D-loop assay (cetacean detections, incl. Delphinus and Megaptera
  novaeangliae) and a 12S rRNA "MiFish" assay (fish detections). Published as
  an intercalibration exercise (source datasetID "CalCOFI_Intercal") on
  GBIF/OBIS, linked to Patin et al. 2026 (Methods in Ecology and Evolution,
  https://doi.org/10.1111/2041-210x.70370). Sequence read counts are a
  semi-quantitative signal of PCR-amplified DNA, not abundance, and are not
  comparable between assays. Published as detections only: edna_presence = 1
  and the read counts. The source archive holds positive detections only, so
  the absence of a row for a filter and taxon is not a non-detection for this
  dataset (a filter or assay run with no detection is simply missing, and
  absence cannot be inferred); this differs from sio_cetacean-edna, where 0
  means not detected in a sequenced sample.
