abstract: CalCOFI PRODO Chlorophyll and Primary Productivity contains chlorophyll
  a, integrated chlorophyll a, primary productivity, and integrated primary production
  values drawn from the California Cooperative Oceanic Fisheries Investigations (CalCOFI)
  hydrographic bottle database, collected during quarterly CalCOFI cruises run by
  the Scripps Institution of Oceanography (SIO). CalCOFI's hydrographic time series
  began in 1949 with weather, temperature, salinity, oxygen, and phosphate measurements;
  nutrient analysis expanded to include silicate, nitrate, and nitrite in 1961, chlorophyll
  was added in 1973, and carbon-14 primary productivity incubations were added in
  1984. The dataset covers primarily the CalCOFI station grid off Southern and Central
  California, with broader coverage extending farther north, south, and offshore during
  early cruises, and spans 1949 to 2020. This dataset supports long-term study of
  phytoplankton biomass and productivity trends in the California Current, for researchers
  studying multi-decade changes in primary production

