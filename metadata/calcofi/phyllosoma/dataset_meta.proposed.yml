# source: caloos-sheet row 22, 2026-09-05
abstract: CalCOFI Phyllosoma Distribution contains occurrence and distribution records
  of phyllosoma, the larval stage of the California spiny lobster (Panulirus interruptus),
  incidentally collected in plankton net tows during California Cooperative Oceanic
  Fisheries Investigations (CalCOFI) cruises, run by the Scripps Institution of Oceanography
  (SIO). The dataset draws on CalCOFI's long-running plankton haul collection and
  spans 1951 to 2008. Larvae were identified from CalCOFI's standard oblique plankton
  net tows. This dataset supports study of spiny lobster larval distribution patterns
  relevant to population connectivity and recruitment, for researchers studying spiny
  lobster life history in the California Current. It originates from foundational
  work by Johnson (1960), which first documented the distribution of these larvae
  using the CalCOFI plankton collection.
