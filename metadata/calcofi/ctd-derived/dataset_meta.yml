# descriptive metadata for calcofi_ctd-derived -- provider-editable (Google Sheet tab `metadata`, scripts/sync_dataset_meta_sheets.R); the structural keys stay in ingest_calcofi_ctd-derived.qmd
  visibility: public
  description: >
    Hydrographic products DERIVED from the CalCOFI CTD cast profiles rather than
    measured: spice (spiciness at 0 dbar, TEOS-10) and the sensor-pair averaged
    sigma-theta at every published CTD depth; and, per cast, the mixed-layer
    depth (the CalCOFI legacy definition, with two alternative criteria beside
    it), the depth and value of the chlorophyll-a maximum, the chlorophyll-a
    integrated over the top 200 m, the hypoxic boundary depths (where oxygen
    falls to 2.4, 1.4 and 0.5 mL/L), the nitracline depth (where nitrate reaches
    1 umol/L), the pycnocline depth (the maximum of the TEOS-10 buoyancy
    frequency N2, also published per depth), by the definitions of the CalCOFI
    CTD team.
    Computed from the full-resolution 1 m bins of the CalCOFI CTD Cast Files
    after the provider's quality flags are applied.
  abstract: >
    Rasmus Swalethorp (CalCOFI-SIO) asked for derived products beside the
    measured CTD series to show, cruise by cruise, how much upwelling and
    productivity there is on the CalCOFI grid, and the California Undercurrent
    an El Nino is expected to strengthen (CalCOFI/workflows#98). Every product
    is computed by one tested function in the calcofi4db R package (>= 4.16.0),
    so the database, the notebooks and the apps cannot disagree on a rule.
  # the release version this dataset was cut in is its locator; calcofi.io is where
  # the integrated database lives -- source: https://calcofi.io/workflows/ingest_calcofi_ctd-derived.html
