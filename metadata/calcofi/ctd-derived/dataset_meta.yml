  methods_md: |
    **Input.** The full-resolution 1 m bins of the CalCOFI CTD Cast Files, as the
    `calcofi_ctd-cast` ingest stages them (`obs_ctd_full`), for the cast of each
    station occupation that the ingest publishes in `obs` (the down cast, the up
    cast only where no down cast exists). A value the provider flags 8
    (questionable) or 9 (bad) is dropped before anything is computed; the
    temperature and salinity used are the sensor-pair averages the ctd-cast ingest
    rebuilds by the provider's flags (`combine_sensor_pair_sql()`).

    **Tiers.** `final` and `preliminary_with_bottle` casts get every product.
    `preliminary_without_bottle` casts have no bottle-corrected salinity, so they
    get only the temperature-criterion mixed-layer depth: nothing salinity-based
    (spice, sigma-theta, density MLD) and no chlorophyll
    estimate, following Rasmus Swalethorp's rule (2026-09-09) that uncorrected
    sensors are not shown.

    **Spice** (`spiciness0`, kg m-3): absolute salinity from practical salinity
    (`gsw_SA_from_SP`), conservative temperature from in-situ temperature
    (`gsw_CT_from_t`), then spiciness at 0 dbar (`gsw_spiciness0`), TEOS-10 via the
    Gibbs SeaWater toolbox (IOC, SCOR and IAPSO 2010; McDougall and Barker 2011) and
    McDougall and Krzysik (2015). Positive is spicy (warm, salty), negative minty.

    **Averaged sigma-theta** (`sigma_theta_ave`, kg m-3): the two sensors'
    sigma-theta combined by the provider's flags, the same rule as every CTD pair.

    **Mixed-layer depth** (m, per cast): the CalCOFI legacy definition given by the
    CTD team (Rasmus Swalethorp, 2026-09-23), the depth at which sigma-theta is
    0.02 kg m-3 greater than at a reference depth of 10 m (`mld_sigma_theta_002`).
    Two alternative criteria are published beside it: a sigma-theta increase of
    0.125 kg m-3 (Levitus 1982; `mld_sigma_theta_0125`) and a temperature departure
    of 0.2 deg C (de Boyer Montegut et al. 2004; `mld_temperature_02`, the only one
    a cast without bottle-corrected salinity can have). Each is interpolated
    linearly between the bracketing bins; a cast that never crosses the threshold,
    or does not reach 10 m, has none. The 0.03 kg m-3 criterion released in
    v2026.10.01 (`mld_sigma_theta_003`) is retired.

    **Chlorophyll-a maximum** (per cast): the depth of the highest value of a 3 m
    running mean of the bottle-fitted sensor estimate (`est_chlorophyll_a_sta_corr`),
    and that mean (Rasmus Swalethorp, 2026-09-23: a 3 m mean so a narrow spike is
    not the maximum while a narrow layer still is). At the top and bottom of the
    profile the mean is over the bins within reach.

    **Integrated chlorophyll-a** (mg m-2, per cast): the sum of the same estimate's
    1 m bins over the top 200 m, or to the cast bottom if shallower
    (`chl_integrated_depth` says how deep it reached; Rasmus Swalethorp,
    2026-09-23). A bin missing inside the profile is interpolated, and the
    shallowest bin is carried to the surface only when it is no deeper than 5 m.

    **Hypoxic boundary depths** (m, per cast): the shallowest depth at which the
    station-corrected oxygen pair average falls to 2.4 mL/L (mild hypoxic
    boundary, `hypoxic_depth_24`), 1.4 mL/L (hypoxic boundary, `hypoxic_depth_14`)
    and 0.5 mL/L (severe, the core of the oxygen minimum zone, `hypoxic_depth_05`),
    each interpolated linearly between the 1 m bins that bracket it (Rasmus
    Swalethorp, 2026-09-24: the oxygen minimum can sit mid-profile, so the
    boundary reported is the shallowest). A cast that never reaches a threshold
    has no value for it.

    **Nitracline depth** (m, per cast): the shallowest depth at which the
    bottle-fitted nitrate estimate (`est_nitrate_sta_corr`) reaches 1 umol/L,
    interpolated between the bracketing bins (Rasmus Swalethorp, 2026-09-24, the
    rule of the CTD team's bottle-era script); the same quantity computed from the
    bottle database's nitrate is published by the bottle-derived dataset under the
    same key.

    **Buoyancy frequency and pycnocline** (per depth and per cast): N2 is TEOS-10
    `gsw_Nsquared` on absolute salinity and conservative temperature of the 1 m
    bins, aligned to the bins and smoothed with a centred 10 m running mean
    (`buoyancy_n2`, 1/s2, at every published CTD depth); the pycnocline depth is
    where that N2 is greatest between 10 and 200 m (`pycnocline_depth`), with the
    value there (`buoyancy_n2_max`), for a cast that starts within 15 m of the
    surface and reaches 50 m, after the CTD team's bottle-era script (Fiedler et
    al. 2013) modernised with TEOS-10 (Rasmus Swalethorp, 2026-09-24).

    **Relative geostrophic velocity** between adjacent stations of each CalCOFI
    line, referenced to 500 dbar, is computed by the same ingest (`ctd_geostrophic()`)
    but is not in the release while the treatment of shelf pairs and closely spaced
    stations is reviewed with the CTD team (questions.csv Q03, Q04;
    CalCOFI/workflows#103).

    Every rule is a function in calcofi4db (`ctd_spice()`, `ctd_sigma_theta_ave()`,
    `ctd_mld()`, `ctd_chl_max()`, `ctd_integrate()`, `ctd_geostrophic()`,
    `ctd_hypoxic_depth()`, `profile_threshold_depth()`, `ctd_n2()`,
    `ctd_pycnocline()`) with unit tests. The mixed-layer, chlorophyll, hypoxic,
    nitracline and pycnocline definitions are the CTD team's (questions.csv Q01,
    Q02, Q10, Q11).

    **References.** de Boyer Montegut, C., G. Madec, A. S. Fischer, A. Lazar and
    D. Iudicone (2004), Mixed layer depth over the global ocean: an examination of
    profile data and a profile-based climatology, J. Geophys. Res. 109, C12003,
    doi:10.1029/2004JC002378. Levitus, S. (1982), Climatological Atlas of the World
    Ocean, NOAA Professional Paper 13. McDougall, T. J. and O. A. Krzysik (2015),
    Spiciness, J. Mar. Res. 73, 141-152, doi:10.1357/002224015816665589. IOC, SCOR
    and IAPSO (2010), The international thermodynamic equation of seawater - 2010
    (TEOS-10), IOC Manuals and Guides 56. McDougall, T. J. and P. M. Barker (2011),
    Getting started with TEOS-10 and the Gibbs Seawater (GSW) Oceanographic Toolbox,
    SCOR/IAPSO WG127. Kelley, D., C. Richards and WG127 (2023), gsw: Gibbs Sea Water
    Functions, R package. Fiedler, P. C., M. F. Mendelssohn, D. M. Palacios and
    S. J. Bograd (2013), Pycnocline variations in the eastern tropical and North
    Pacific, 1958-2008, J. Climate 26, 583-599, doi:10.1175/JCLI-D-11-00728.1.
    Bograd, S. J., C. G. Castro, E. Di Lorenzo, D. M. Palacios, H. Bailey, W. Gilly
    and F. P. Chavez (2008), Oxygen declines and the shoaling of the hypoxic
    boundary in the California Current, Geophys. Res. Lett. 35, L12607,
    doi:10.1029/2008GL034185.
