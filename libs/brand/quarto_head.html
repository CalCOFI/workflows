<!-- cc-brand v1 — the calcofi.io brand contract (https://calcofi.io/brand/v1/) for a
     rendered Quarto notebook. Included by _quarto.yml (include-in-header) on every
     render, and injected into already-rendered _output/*.html that lack the marker
     above by scripts/brand_inject_html.R (run by the Pages workflow). Quarto 1.8's
     Bootstrap 5.3 bundle carries native colour modes, so setting data-bs-theme on
     <html> is all a page needs; the CSS below covers what Bootstrap does not own. -->
<link rel="icon" type="image/x-icon" href="https://calcofi.io/brand/v1/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="https://calcofi.io/brand/v1/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://calcofi.io/brand/v1/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://calcofi.io/brand/v1/apple-touch-icon.png">
<script>(function(){var m=/[?&]theme=(dark|light)\b/.exec(location.search),c=/(?:^|;\s*)cc_theme=(dark|light)/.exec(document.cookie),s=null;try{s=localStorage.getItem("theme")}catch(e){}var t=(m&&m[1])||(c&&c[1])||(s==="light"||s==="dark"?s:null)||"dark",d=document.documentElement;d.dataset.theme=t;d.setAttribute("data-bs-theme",t);d.setAttribute("data-md-color-scheme",t==="dark"?"slate":"default");d.style.colorScheme=t})();</script>
<link rel="stylesheet" href="https://calcofi.io/brand/v1/theme.css">
<script defer src="https://calcofi.io/brand/v1/theme.js"></script>
<style>
  /* the brand bar sits above quarto's own sticky sidebars */
  .cc-header { font-size: 0.9rem; }
  #quarto-margin-sidebar, #quarto-sidebar { top: 3.4rem; }
  #quarto-content { padding-top: 0.5rem; }
  /* bootstrap's dark colour mode handles body/text/links/tables; quarto's code
     highlighting is hard-coded for a light page, so remap it (arrow theme → a
     light-on-dark palette) and give code blocks the panel tone */
  [data-bs-theme="dark"] div.sourceCode, [data-bs-theme="dark"] pre { background-color: #24272b; color: #e6e9ed; }
  [data-bs-theme="dark"] code:not(.sourceCode) { color: #ffa8a8; background: #2c3035; }
  [data-bs-theme="dark"] code span.kw, [data-bs-theme="dark"] code span.cf { color: #d0bfff; }
  [data-bs-theme="dark"] code span.fu { color: #74c0fc; }
  [data-bs-theme="dark"] code span.st, [data-bs-theme="dark"] code span.ss, [data-bs-theme="dark"] code span.vs { color: #8ce99a; }
  [data-bs-theme="dark"] code span.co, [data-bs-theme="dark"] code span.do { color: #9aa0a6; font-style: italic; }
  [data-bs-theme="dark"] code span.dv, [data-bs-theme="dark"] code span.fl, [data-bs-theme="dark"] code span.cn, [data-bs-theme="dark"] code span.bn { color: #ffd43b; }
  [data-bs-theme="dark"] code span.va, [data-bs-theme="dark"] code span.at, [data-bs-theme="dark"] code span.dt { color: #e6e9ed; }
  [data-bs-theme="dark"] code span.op, [data-bs-theme="dark"] code span.sc { color: #c1c8cf; }
  [data-bs-theme="dark"] code span.ot, [data-bs-theme="dark"] code span.er, [data-bs-theme="dark"] code span.al { color: #ffa8a8; }
  [data-bs-theme="dark"] .code-tools-button, [data-bs-theme="dark"] .quarto-title-block .btn { color: #e6e9ed; }
  [data-bs-theme="dark"] .quarto-title-block, [data-bs-theme="dark"] .cell-output-display { color-scheme: dark; }
  [data-bs-theme="dark"] .cell-output pre, [data-bs-theme="dark"] .cell-output-stdout pre { background-color: #1f2225; }
  [data-bs-theme="dark"] table.dataTable, [data-bs-theme="dark"] .dataTables_wrapper { color: #e6e9ed; }
  [data-bs-theme="dark"] .nav-tabs .nav-link.active { background: #24272b; border-color: #3a3f44 #3a3f44 #24272b; }
</style>
