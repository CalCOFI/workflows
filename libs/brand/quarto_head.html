<!-- cc-brand v2 — the calcofi.io brand contract (https://calcofi.io/brand/v2/; the SIO look,
     light by default, in force 2026-09-04) for a rendered Quarto notebook. Included by
     _quarto.yml (include-in-header) on every render, and injected into (or swapped into, for a
     page still wearing the v1 chrome) already-rendered _output/*.html by
     scripts/brand_inject_html.R (run by the Pages workflow). Quarto 1.8's Bootstrap 5.3 bundle
     carries native colour modes, so setting data-bs-theme on <html> is all a page needs; the CSS
     below covers what Bootstrap does not own. A notebook is a page (the reading scale): no cc-scale meta. -->
<link rel="icon" type="image/x-icon" href="https://calcofi.io/brand/v2/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="https://calcofi.io/brand/v2/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://calcofi.io/brand/v2/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://calcofi.io/brand/v2/apple-touch-icon.png">
<link rel="preload" href="https://calcofi.io/brand/v2/fonts/SourceSans3-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://calcofi.io/brand/v2/fonts/Teko-VF.woff2" as="font" type="font/woff2" crossorigin>
<script>(function(){var d=document.documentElement,m=/[?&]theme=(dark|light)\b/.exec(location.search),k=/(?:^|;\s*)cc_theme_src=user\b/.test(document.cookie),c=k&&/(?:^|;\s*)cc_theme=(dark|light)\b/.exec(document.cookie),s=null;try{if(localStorage.getItem("cc_theme_src")==="user")s=localStorage.getItem("cc_theme")}catch(e){}var t=(m&&m[1])||(c&&c[1])||(s==="dark"||s==="light"?s:null)||"light";d.dataset.theme=t;d.setAttribute("data-bs-theme",t);d.setAttribute("data-md-color-scheme",t==="dark"?"slate":"default");d.style.colorScheme=t;var sc=document.querySelector('meta[name="cc-scale"]');if(sc&&sc.content)d.setAttribute("data-cc-scale",sc.content)})();</script>
<link rel="stylesheet" href="https://calcofi.io/brand/v2/fonts.css">
<link rel="stylesheet" href="https://calcofi.io/brand/v2/theme.css">
<script defer src="https://calcofi.io/brand/v2/theme.js"></script>
<style>
  /* the brand bar sits above quarto's own sticky sidebars */
  #quarto-margin-sidebar, #quarto-sidebar { top: calc(var(--header-h) + 0.5rem); }
  #quarto-content { padding-top: 0.5rem; }
  /* bootstrap's dark colour mode handles body/text/links/tables; quarto's code
     highlighting is hard-coded for a light page, so remap it (arrow theme → a
     light-on-navy palette, brand v2's dark tokens) and give code blocks the panel tone */
  [data-bs-theme="dark"] div.sourceCode, [data-bs-theme="dark"] pre { background-color: #182b49; color: #e9edf3; }
  [data-bs-theme="dark"] code:not(.sourceCode) { color: #ffa8a8; background: #21375c; }
  [data-bs-theme="dark"] code span.kw, [data-bs-theme="dark"] code span.cf { color: #d0bfff; }
  [data-bs-theme="dark"] code span.fu { color: #74c0fc; }
  [data-bs-theme="dark"] code span.st, [data-bs-theme="dark"] code span.ss, [data-bs-theme="dark"] code span.vs { color: #8ce99a; }
  [data-bs-theme="dark"] code span.co, [data-bs-theme="dark"] code span.do { color: #9fb0c8; font-style: italic; }
  [data-bs-theme="dark"] code span.dv, [data-bs-theme="dark"] code span.fl, [data-bs-theme="dark"] code span.cn, [data-bs-theme="dark"] code span.bn { color: #ffd43b; }
  [data-bs-theme="dark"] code span.va, [data-bs-theme="dark"] code span.at, [data-bs-theme="dark"] code span.dt { color: #e9edf3; }
  [data-bs-theme="dark"] code span.op, [data-bs-theme="dark"] code span.sc { color: #c9d3e2; }
  [data-bs-theme="dark"] code span.ot, [data-bs-theme="dark"] code span.er, [data-bs-theme="dark"] code span.al { color: #ffa8a8; }
  [data-bs-theme="dark"] .code-tools-button, [data-bs-theme="dark"] .quarto-title-block .btn { color: #e9edf3; }
  [data-bs-theme="dark"] .quarto-title-block, [data-bs-theme="dark"] .cell-output-display { color-scheme: dark; }
  [data-bs-theme="dark"] .cell-output pre, [data-bs-theme="dark"] .cell-output-stdout pre { background-color: #0f1a2e; }
  [data-bs-theme="dark"] table.dataTable, [data-bs-theme="dark"] .dataTables_wrapper { color: #e9edf3; }
  [data-bs-theme="dark"] .nav-tabs .nav-link.active { background: #182b49; border-color: #34486b #34486b #182b49; }
</style>
