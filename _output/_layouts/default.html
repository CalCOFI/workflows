<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- cc-brand v2 — the calcofi.io brand contract (https://calcofi.io/brand/v2/; the SIO look,
       light by default, in force 2026-09-04): favicon set, the fonts, the pre-paint theme snippet,
       theme.css + theme.js — before the site stylesheet. The landing page is a page (reading
       scale): no cc-scale meta. Keep in step with libs/brand/quarto_head.html, which dresses
       every rendered notebook the same way. -->
  <link rel="icon" type="image/x-icon" href="https://calcofi.io/brand/v2/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="https://calcofi.io/brand/v2/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://calcofi.io/brand/v2/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://calcofi.io/brand/v2/apple-touch-icon.png">
  <link rel="preload" href="https://calcofi.io/brand/v2/fonts/SourceSans3-VF.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="https://calcofi.io/brand/v2/fonts/Teko-VF.woff2" as="font" type="font/woff2" crossorigin>
  <script>(function(){var d=document.documentElement,m=/[?&]theme=(dark|light)\b/.exec(location.search),k=/(?:^|;\s*)cc_theme_src=user\b/.test(document.cookie),c=k&&/(?:^|;\s*)cc_theme=(dark|light)\b/.exec(document.cookie),s=null;try{if(localStorage.getItem("cc_theme_src")==="user")s=localStorage.getItem("cc_theme")}catch(e){}var t=(m&&m[1])||(c&&c[1])||(s==="dark"||s==="light"?s:null)||"light";d.dataset.theme=t;d.setAttribute("data-bs-theme",t);d.setAttribute("data-md-color-scheme",t==="dark"?"slate":"default");d.style.colorScheme=t;var sc=document.querySelector('meta[name="cc-scale"]');if(sc&&sc.content)d.setAttribute("data-cc-scale",sc.content)})();</script>
  <link rel="stylesheet" href="https://calcofi.io/brand/v2/fonts.css">
  <link rel="stylesheet" href="https://calcofi.io/brand/v2/theme.css">
  <script defer src="https://calcofi.io/brand/v2/theme.js"></script>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

  <!-- Google tag (gtag.js) — CalCOFI site property.
       GENERATED/COPIED from CalCOFI/analytics → snippets/gtag-site.html.
       Change only workflows; keep the rest byte-identical across sites so
       one snippet edit can be rolled out mechanically. `content_group` is what
       the usage report at calcofi.io/analytics/ joins on. -->
  <script>
    // hostname guard: keeps local previews and forks out of the property,
    // without depending on a build-system flag (these sites are built five
    // different ways).
    window.__CC_GA = location.hostname.endsWith("calcofi.io")
                   && !navigator.webdriver;   // skip Playwright/Puppeteer/shot-scraper
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0HVK8TDMCF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    if (window.__CC_GA) {
      gtag('js', new Date());
      gtag('config', 'G-0HVK8TDMCF', { content_group: 'workflows' });
    }
  </script>
</head>
<body>

<div id="layout">

  <header class="cc-header">
    <a class="cc-home" href="https://calcofi.io" aria-label="CalCOFI.io home">
      <!-- the horizontal lockup, sized by theme.css (--lockup-h), never a fixed 32 px -->
      <img class="cc-logo-dark"  src="https://calcofi.io/brand/v2/logo_calcofi_h.svg"       alt="CalCOFI">
      <img class="cc-logo-light" src="https://calcofi.io/brand/v2/logo_calcofi_h_light.svg" alt="CalCOFI">
    </a>
    <a class="cc-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <span class="cc-spacer"></span>

    <nav class="cc-links">
      <a href="https://calcofi.io/db-schema/">schema</a>
      <a href="https://calcofi.io/db-query/">query</a>
      <a href="https://calcofi.io/docs/">docs</a>
    </nav>

    <button class="cc-theme-toggle" type="button" aria-label="Toggle dark / light theme">🌓</button>
  </header>

  <main id="panel">
    {{ content }}
    <footer class="cc-footer">
      <p>
        Source · <a href="https://github.com/CalCOFI/workflows">CalCOFI/workflows</a>
        · See also · <a href="https://calcofi.io/schema/">schema</a>
        · <a href="https://calcofi.io/query/">query</a>
        · <a href="https://calcofi.io/docs/">docs</a>
        · <a href="https://calcofi.io/calcofi4r/">calcofi4r</a>
        · <a href="https://calcofi.io/uptime/">uptime</a>
      </p>
    </footer>
  </main>

</div>

</body>
</html>
